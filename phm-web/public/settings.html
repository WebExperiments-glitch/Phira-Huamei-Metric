<title>设置 · P.H.M.</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0d10'/%3E%3Ctext x='16' y='23' font-size='19' font-family='sans-serif' font-weight='bold' text-anchor='middle' fill='%23f0b03f'%3EP%3C/text%3E%3C/svg%3E">
<meta name="description" content="P.H.M. 设置：隐私与数据、账号管理、外观与语言、本机存储。">
<meta name="robots" content="noindex">
<!-- 主题：必须**同步内联**在样式表之前 —— 模块是异步的，等它跑完页面
     已经按默认色画过一帧了，刷新时就会闪一下（FOUC）。
     读的键与 /js/settings.js 的 KEYS.theme 一致（phm_theme）。 -->
<script>(function(){var t="auto";try{t=localStorage.getItem("phm_theme")||"auto";}catch(e){}
var d=t==="dark"||(t==="auto"&&window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches);
var el=document.documentElement;el.setAttribute("data-theme",d?"dark":"light");el.setAttribute("data-theme-mode",t);})();</script>
<link rel="stylesheet" href="/css/base.css?v=V0.8.2">
<style>
/* ══════════════════════════════════════════════════════════════
   设置页布局 —— 左栏分组导航 + 右侧行式条目
   ══════════════════════════════════════════════════════════════ */

.shell{display:grid;grid-template-columns:206px 1fr;gap:28px;align-items:start}

/* ── 左栏 ── */
.snav{position:sticky;top:18px}
.snavh{font-size:var(--t-sm);letter-spacing:.06em;color:var(--fg3);
  text-transform:uppercase;padding:0 12px 8px;font-weight:600}
.snav nav{display:flex;flex-direction:column;gap:2px}
.snavi{display:flex;align-items:center;gap:9px;padding:8px 12px;border-radius:var(--r-sm);
  color:var(--fg2);font-size:13.5px;text-decoration:none;border:1px solid transparent;
  transition:background .14s var(--ease),color .14s var(--ease)}
.snavi .ic{width:15px;height:15px;flex:0 0 auto;opacity:.75}
.snavi:hover{background:var(--card2);color:var(--fg);text-decoration:none}
.snavi.on{background:var(--card2);border-color:var(--line);color:var(--fg);font-weight:500}
.snavi.on .ic{opacity:1;color:var(--brand)}

/* ── 右侧 ── */
.smain{min-width:0}
.ssec{margin-bottom:36px;scroll-margin-top:18px}
.ssec:last-child{margin-bottom:0}
.ssec h2{font-size:var(--t-xl);font-weight:600;margin-bottom:6px;letter-spacing:-.1px}
.ssec .sdesc{font-size:var(--t-sm);color:var(--fg3);line-height:1.72;margin-bottom:14px}
.ssec h3{font-size:13.5px;font-weight:600;color:var(--fg2);margin:22px 0 8px}

.sgroup{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);
  padding:0 16px;overflow:hidden}
.sgroup + .sgroup{margin-top:10px}

.srow{display:flex;gap:18px;align-items:center;justify-content:space-between;
  padding:14px 0;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:none}
.srow .sl{min-width:0}
/* ⚠ 必须用 `>` 直接子选择器 —— 用 `.sl b` 会把**说明文字里**的 <b> 也变成
   块级，于是「这些本站 / 根本接触不到 / ——」被拆成三行（真踩过）。 */
.srow .sl > b{display:block;font-size:13.5px;font-weight:500;line-height:1.5}
.srow .sl > span{display:block;font-size:12.2px;color:var(--fg3);margin-top:3px;line-height:1.65}
.srow .sc{flex:0 0 auto;display:flex;align-items:center;gap:8px}
.srow .sc .val{font-family:var(--mono);font-size:11.8px;color:var(--fg2);
  max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow.wide{justify-content:flex-start}
.srow.wide .sc{margin-left:auto}

/* ── 开关（iOS 风格；开启色用品牌琥珀，不用绿色）── */
.sw{position:relative;display:inline-block;width:44px;height:25px;flex:0 0 auto;cursor:pointer}
.sw input{position:absolute;opacity:0;width:0;height:0}
.sw i{position:absolute;inset:0;background:var(--card3);border:1px solid var(--line2);
  border-radius:999px;transition:background .16s var(--ease),border-color .16s var(--ease)}
.sw i::after{content:"";position:absolute;width:19px;height:19px;left:2px;top:2px;
  background:var(--fg3);border-radius:50%;transition:transform .16s var(--ease),background .16s var(--ease)}
.sw input:checked + i{background:var(--brand-soft);border-color:var(--brand-line)}
.sw input:checked + i::after{background:var(--brand);transform:translateX(19px)}
.sw input:focus-visible + i{box-shadow:0 0 0 3px var(--brand-soft)}

/* ── 分段控件：用于"三选一"（主题）和"二选一"（语言）──
   比下拉框更直观，也比一排单选框省空间。 */
.seg{display:inline-flex;background:var(--card2);border:1px solid var(--line);
  border-radius:9px;padding:2px;gap:2px}
.seg button{border:0;background:transparent;color:var(--fg2);font:inherit;
  font-size:12.4px;padding:5px 11px;border-radius:7px;cursor:pointer;white-space:nowrap;
  transition:background .14s var(--ease),color .14s var(--ease)}
.seg button:hover{color:var(--fg)}
.seg button.on{background:var(--card);color:var(--fg);box-shadow:var(--sh1)}

/* ── 按钮 ── */
.sbtn{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:8px;
  border:1px solid var(--line2);background:var(--card2);color:var(--fg);
  font-size:var(--t-sm);font-family:inherit;cursor:pointer;white-space:nowrap;
  text-decoration:none;transition:border-color .14s var(--ease),background .14s var(--ease),color .14s var(--ease)}
.sbtn:hover:not(:disabled){border-color:var(--brand-line);background:var(--card3);text-decoration:none}
.sbtn:disabled{opacity:.4;cursor:not-allowed}
.sbtn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:600}
.sbtn.primary:hover:not(:disabled){background:#f7bd5a;border-color:#f7bd5a;color:var(--brand-ink)}
.sbtn.danger{color:var(--err);border-color:var(--err);opacity:.85}
.sbtn.danger:hover:not(:disabled){background:rgba(229,83,75,.12);opacity:1}

/* ── 键值表 ── */
table.kv{width:100%;font-size:var(--t-sm);border-collapse:collapse}
table.kv td{padding:9px 0;border-bottom:1px solid var(--line);vertical-align:middle}
table.kv tr:last-child td{border-bottom:none}
table.kv td.k{color:var(--fg2);width:46%}
table.kv td.v{font-family:var(--mono);font-size:11.6px;color:var(--fg3);word-break:break-all}
table.kv td.a{width:1%;text-align:right;white-space:nowrap}
code.k{font-family:var(--mono);font-size:11.2px;color:var(--fg3);
  background:var(--card2);padding:1px 5px;border-radius:4px;white-space:nowrap}

@media (max-width:760px){
  .shell{grid-template-columns:1fr;gap:14px}
  .snav{position:static}
  .snavh{display:none}
  .snav nav{flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:4px}
  .snavi{white-space:nowrap;padding:6px 11px;font-size:12.6px}
  .srow{gap:12px}
  .srow .sc .val{max-width:120px}
}
</style>

<script type="module">
import { renderNav, esc, APP_VER } from '/js/ui.js';
import * as S from '/js/settings.js';
import { t, applyStatic, currentLang, setLang, onLangChange } from '/js/i18n.js';

renderNav('settings');
applyStatic();

const $ = s => document.querySelector(s);

function msg(text, kind) {
  const el = $('#stMsg');
  if (!el) return;
  el.textContent = text || '';
  el.className = 'status' + (kind ? ' ' + kind : '');
}
function acctMsg(text, kind) {
  const el = $('#acctMsg');
  if (!el) return;
  el.textContent = text || '';
  el.className = 'status' + (kind ? ' ' + kind : '');
}

/* ═══════════ 外观 ═══════════ */

function paintTheme() {
  const mode = S.theme.get();
  document.querySelectorAll('#themeSeg button').forEach(function (b) {
    b.classList.toggle('on', b.getAttribute('data-mode') === mode);
  });
}
$('#themeSeg').addEventListener('click', function (e) {
  const b = e.target.closest('button[data-mode]');
  if (!b) return;
  S.theme.set(b.getAttribute('data-mode'));
  paintTheme();
});

/* ═══════════ 语言 ═══════════ */

function paintLang() {
  const cur = currentLang();
  document.querySelectorAll('#langSeg button').forEach(function (b) {
    b.classList.toggle('on', b.getAttribute('data-lang') === cur);
  });
}
$('#langSeg').addEventListener('click', function (e) {
  const b = e.target.closest('button[data-lang]');
  if (!b) return;
  setLang(b.getAttribute('data-lang'));   /* 广播出去，下面订阅负责重绘 */
});

/* ═══════════ 隐私与数据 ═══════════ */

function paintOptin() {
  const on = S.optin.get();
  const cb = $('#optin');
  if (cb.checked !== on) cb.checked = on;
  const st = $('#optinState');
  st.textContent = t(on ? 'set.optin.on' : 'set.optin.off');
  st.className = 'status' + (on ? ' ok' : ' warn');
}

function paintNotice() {
  const agreed = S.notice.agreed();
  $('#noticeState').textContent = t(agreed ? 'set.notice.done' : 'set.notice.pending');
  $('#noticeReset').disabled = !agreed;
}

$('#optin').addEventListener('change', function () {
  if (!S.optin.set(this.checked)) {
    msg('Browser refused the write (private mode?) — this toggle will not stick.', 'err');
    paintOptin();
    return;
  }
  paintOptin();
});

$('#noticeReset').addEventListener('click', function () {
  S.notice.forget();
  paintNotice();
  msg(t('set.notice.pending'), 'ok');
});

/* ═══════════ 账号管理 ═══════════
   ⚠ 这里**不重复实现登录表单**。/app 的账号面板已有完整流程
   （邮箱验证码、找回密码、改密、强度校验），再写一份必然漂移。
   设置页负责「看状态 + 执行关键操作」，登录/注册按钮直接把人送过去。 */

const CLOUD_CFG = {
  endpoint: 'https://phm.app.workbuddy.host',
  publishableKey: 'wbpk_TRm3Cbt5VeYHHDwUL854jr_5Xi69EqYG18sPzQnMMJhJr08x67NoE3b',
};
let cloud = null, cloudDB = null;
try {
  if (window.WorkBuddyCloud && window.WorkBuddyCloud.createWorkBuddyCloud) {
    cloud = window.WorkBuddyCloud.createWorkBuddyCloud(CLOUD_CFG);
    cloudDB = cloud.database;
  }
} catch (e) { cloud = null; cloudDB = null; }

async function currentUser() {
  if (!cloud || !cloud.auth) return null;
  try {
    const r = await cloud.auth.getUser();
    return (r && (r.data ? (r.data.user || r.data) : r.user)) || null;
  } catch (e) { return null; }
}

function mkBtn(label, cls, handler, id) {
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'sbtn' + (cls ? ' ' + cls : '');
  b.textContent = label;
  if (id) b.id = id;
  b.addEventListener('click', handler);
  return b;
}

async function paintAccount() {
  const box = $('#acctActions'), st = $('#acctState');
  if (!box || !st) return;
  box.innerHTML = '';
  const user = await currentUser();
  if (!user) {
    st.textContent = t('set.acct.loggedout.desc');
    const go = document.createElement('a');
    go.className = 'sbtn primary';
    go.href = '/app#account';
    go.textContent = t('set.acct.go');
    box.appendChild(go);
    return;
  }
  st.textContent = String(user.email || user.username || user.id || '');
  box.appendChild(mkBtn(t('c.logout'), 'danger', async function () {
    try {
      if (cloud && cloud.auth && cloud.auth.signOut) await cloud.auth.signOut();
      acctMsg(t('c.logout') + ' ✓', 'ok');
      paintAccount(); paintBind();
    } catch (e) { acctMsg(String((e && e.message) || e), 'err'); }
  }, 'logoutBtn'));
}

async function paintBind() {
  const box = $('#bindActions'), st = $('#bindState');
  if (!box || !st) return;
  box.innerHTML = '';
  let bound = null;
  if (cloudDB) {
    try {
      const r = await cloudDB.from('phm_profiles').select('phira_uid,phira_name').maybeSingle();
      if (r && r.data) bound = r.data;
    } catch (e) { /* 未登录 / 不可读都走这里 */ }
  }
  const local = S.phira.get();

  if (bound && bound.phira_uid) {
    st.textContent = (bound.phira_name || '') + ' #' + bound.phira_uid;
    box.appendChild(mkBtn(t('set.acct.unbind'), 'danger', async function () {
      if (!cloudDB) return;
      const r = await cloudDB.from('phm_profiles')
        .upsert({ phira_uid: null, phira_name: null, last_seen: new Date().toISOString() },
                { onConflict: 'owner_id' });
      if (r && r.error) { acctMsg(String(r.error.message || 'error'), 'err'); return; }
      acctMsg(t('set.acct.unbind') + ' ✓', 'ok');
      paintBind();
    }));
  } else if (local.uid) {
    st.textContent = t('set.acct.bindhint');
    box.appendChild(mkBtn(t('set.acct.bind'), 'primary', async function () {
      if (!cloudDB) { acctMsg('Cloud not connected', 'err'); return; }
      const user = await currentUser();
      if (!user) { acctMsg(t('set.acct.loggedout.desc'), 'warn'); return; }
      const r = await cloudDB.from('phm_profiles').upsert({
        phira_uid: Number(local.uid) || null,
        phira_name: local.name || null,
        last_seen: new Date().toISOString(),
      }, { onConflict: 'owner_id' });
      if (r && r.error) { acctMsg(String(r.error.message || 'error'), 'err'); return; }
      acctMsg(t('set.acct.binddone') + ' ✓', 'ok');
      paintBind();
    }));
  } else {
    st.textContent = t('set.acct.unbound');
    const go = document.createElement('a');
    go.className = 'sbtn';
    go.href = '/user';
    go.textContent = t('nav.user');
    box.appendChild(go);
  }
}

/* ═══════════ Phira 本地记录 ═══════════ */

function paintPhira() {
  const p = S.phira.get();
  $('#pfName').textContent = p.name || t('c.none');
  $('#pfUid').textContent = p.uid || t('c.none');
  const last = S.lastUid.get();
  $('#pfLast').textContent = last ? 'UID ' + last : t('c.none');
  $('#pfClear').disabled = !p.name && !p.uid;
}

$('#pfClear').addEventListener('click', function () {
  S.phira.clear();
  paintPhira();
  msg(t('set.phira.clear') + ' ✓', 'ok');
});

function paintOwn() {
  const list = S.own.list();
  const box = $('#ownList');
  if (!list.length) {
    box.innerHTML = '<div class="empty">' + esc(t('set.own.empty')) + '</div>';
    return;
  }
  box.innerHTML = '<table class="kv">' + list.map(uid =>
    '<tr><td class="k">UID ' + esc(uid) + '</td>'
    + '<td class="v">' + esc(t('set.own.note')) + '</td>'
    + '<td class="a"><button class="sbtn danger" type="button" data-unown="'
    + esc(uid) + '">' + esc(t('set.own.revoke')) + '</button></td></tr>').join('') + '</table>';
  box.querySelectorAll('[data-unown]').forEach(b => b.addEventListener('click', function () {
    S.own.unmark(this.getAttribute('data-unown'));
    paintOwn();
  }));
}

/* ═══════════ 本机存储 ═══════════ */

function paintInventory() {
  const rows = S.inventory();
  const box = $('#inv');
  if (!rows.length) {
    box.innerHTML = '<div class="empty">' + esc(t('set.storage.empty')) + '</div>';
    return;
  }
  box.innerHTML = '<table class="kv">' + rows.map(r =>
    '<tr><td class="k">' + esc(r.label) + '</td>'
    + '<td class="v">' + esc(r.value) + '</td>'
    + '<td class="a"><code class="k">' + esc(r.key) + '</code></td></tr>').join('') + '</table>';
}

$('#expBtn').addEventListener('click', function () {
  try {
    const blob = new Blob([JSON.stringify(S.exportAll(), null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'phm-settings.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    msg('phm-settings.json ✓', 'ok');
  } catch (e) { msg('Export failed: ' + ((e && e.message) || ''), 'err'); }
});

$('#cidReset').addEventListener('click', function () {
  S.cid.reset();
  paintInventory();
  msg(t('set.acct.clearcid') + ' ✓', 'ok');
});

$('#clearBtn').addEventListener('click', function () {
  let ok = false;
  try {
    ok = confirm(currentLang() === 'en'
      ? 'Clear all P.H.M. settings stored in this browser?\n\nRemoves: upload toggle, notice consent, autofill username/UID, "this is mine" declarations, anonymous ID.\n\nDoes NOT remove: the cloud sign-in session (you stay signed in), or anything on the server.\n\nAfterwards everything returns to defaults — which means auto-upload is ON again.'
      : '清空本站的全部设置？\n\n会删掉：上传开关、告知确认、自动填充的用户名/UID、本人账号声明、匿名标识\n\n不会删：云服务的登录会话（你不会被登出）\n不会删：服务器上的任何数据\n\n清空后所有设置回到默认值（默认是「开启上传」）。');
  } catch (e) { ok = false; }
  if (!ok) return;
  S.clearAll();
  paintAll();
  msg(t('set.storage.clear') + ' ✓', 'warn');
});

/* ═══════════ 关于 ═══════════ */

function paintAbout() {
  $('#abVer').textContent = APP_VER;
  $('#abStore').textContent = S.available ? t('set.about.yes') : t('set.about.no');
}

(async function about() {
  try {
    const r = await fetch('/api/summary');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const s = await r.json();
    $('#abEng').textContent = s.engineVer || '—';
    $('#abTotal').textContent = s.total == null ? '—'
      : s.total + (currentLang() === 'en' ? ' charts' : ' 张');
  } catch (e) {
    $('#abEng').textContent = t('set.about.fail');
    $('#abTotal').textContent = t('set.about.fail');
  }
})();

/* ═══════════ 左栏高亮跟随滚动 ═══════════ */
const navLinks = Array.prototype.slice.call(document.querySelectorAll('#snav .snavi'));
function markActive(id) {
  navLinks.forEach(a => a.classList.toggle('on', a.getAttribute('href') === '#' + id));
}
navLinks.forEach(a => a.addEventListener('click', () => markActive(a.getAttribute('href').slice(1))));
try {
  const io = new IntersectionObserver(function (entries) {
    const vis = entries.filter(e => e.isIntersecting)
      .sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top);
    if (vis.length) markActive(vis[0].target.id);
  }, { rootMargin: '-10% 0px -70% 0px', threshold: 0 });
  document.querySelectorAll('.ssec').forEach(s => io.observe(s));
} catch (e) { /* 老浏览器：只保留点击高亮 */ }

/* ═══════════ 全量重绘 ═══════════ */

function paintAll() {
  paintTheme();
  paintLang();
  paintOptin();
  paintNotice();
  paintPhira();
  paintOwn();
  paintInventory();
  paintAbout();
}

/* 语言一变：静态部分 applyStatic 处理，动态部分要重画 */
onLangChange(function () {
  applyStatic();
  paintAll();
  paintAccount();
  paintBind();
});
/* 另一个标签页改了设置，本页跟上 */
S.subscribe(function () { paintAll(); });

paintAll();
paintAccount();
paintBind();
</script>
</body>
</html>
