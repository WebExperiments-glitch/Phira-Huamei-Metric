<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="app-version" content="V0.8.1">
<meta name="robots" content="noindex">
<title>404 · 页面不存在 — P.H.M. Standard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d1117'/%3E%3Ctext x='16' y='23' font-size='19' font-family='sans-serif' font-weight='bold' text-anchor='middle' fill='%23e8a33d'%3EP%3C/text%3E%3C/svg%3E">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0d1117">
<!-- 错误页不该被搜索引擎收录：它会被当成重复内容，也会污染「谱面定数」的检索结果 -->
<style>
:root{--bg:#0d1117;--card:#161b22;--card2:#1c2330;--fg:#e6edf3;--fg2:#9aa7b4;--fg3:#6b7684;
--line:#2a313c;--amber:#e8a33d;--blue:#5aa2e8}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);min-height:100vh;display:flex;align-items:center;justify-content:center;
padding:24px;font:14px/1.7 "Segoe UI",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
.box{max-width:560px;width:100%;background:var(--card);border:1px solid var(--line);
border-radius:16px;padding:36px 30px;text-align:center}
.code{font-size:56px;font-weight:800;letter-spacing:2px;color:var(--amber);line-height:1}
h1{font-size:17px;margin:14px 0 8px;font-weight:700}
p{color:var(--fg2);font-size:13px}
.mono{font-family:ui-monospace,Consolas,monospace;color:var(--fg3);font-size:12px;word-break:break-all;
background:var(--card2);border-radius:8px;padding:8px 10px;margin:14px 0 0;display:block}
.acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:22px}
a.btn{display:inline-block;text-decoration:none;border-radius:9px;padding:9px 18px;font-size:13px;
border:1px solid var(--line);color:var(--fg2);transition:.15s}
a.btn:hover{border-color:var(--blue);color:var(--fg);background:var(--card2)}
a.btn.p{border-color:var(--amber);color:var(--amber)}
a.btn.p:hover{background:rgba(232,163,61,.1);color:var(--amber)}
.tips{margin-top:22px;padding-top:18px;border-top:1px solid var(--line);font-size:12px;color:var(--fg3);text-align:left}
.tips b{color:var(--fg2)}
.tips ul{margin:8px 0 0 18px}
.tips li{margin:3px 0}
</style>
<!-- 主题：必须**同步内联**在样式表之前 —— 模块是异步的，等它跑完页面
     已经按默认色画过一帧了，刷新时就会闪一下（FOUC）。
     读的键与 /js/settings.js 的 KEYS.theme 一致（phm_theme）。 -->
<script>(function(){var t="auto";try{t=localStorage.getItem("phm_theme")||"auto";}catch(e){}
var d=t==="dark"||(t==="auto"&&window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches);
var el=document.documentElement;el.setAttribute("data-theme",d?"dark":"light");el.setAttribute("data-theme-mode",t);})();</script>
</head>
<body>
<div class="box">
  <div class="code">404</div>
  <h1>这个页面不存在</h1>
  <p>地址可能打错了，或者这个页面已经被移除。</p>
  <code class="mono" id="p">—</code>

  <div class="acts">
    <a class="btn p" href="/">← 回首页</a>
    <a class="btn" href="/privacy">隐私政策</a>
    <a class="btn" href="https://github.com/WebExperiments-glitch/Phira-Huamei-Metric"
       target="_blank" rel="noopener">GitHub</a>
  </div>

  <div class="tips">
    <b>想查谱面定数？</b>首页有两种方式，都不需要注册：
    <ul>
      <li>用顶部<b>搜索</b>框按曲名找，点「算」直接出定数（约 2–5 秒）；</li>
      <li>或把 Phira <b>谱面包</b>（<code>.pez</code> / 含 <code>chart.json</code> 的 zip）
          拖进首页虚线框，纯本机解析，<b>文件不会上传</b>。</li>
    </ul>
  </div>
</div>
<script>
/* 把出错路径回显出来 —— 但不直接拼 HTML，避免把 URL 当注入面 */
var el = document.getElementById("p");
var t = "";
try { t = decodeURIComponent(location.pathname + location.search); } catch (e) { t = location.pathname; }
el.textContent = t.length > 200 ? t.slice(0, 200) + "…" : t;
</script>
</body>
</html>
