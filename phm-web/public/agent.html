<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="app-version" content="V0.22.5.0">
<title>AI 写谱 · P.H.M.</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d1117'/%3E%3Ctext x='16' y='23' font-size='19' font-family='sans-serif' font-weight='bold' text-anchor='middle' fill='%23e8a33d'%3EP%3C/text%3E%3C/svg%3E">
<!-- 防闪烁：必须在样式表之前跑，否则深色模式会先白一帧。
     属性名 theme/font/size 与 settings.js 保持一致。 -->
<script>(function(){var t="auto";try{t=localStorage.getItem("phm_theme")||"auto";}catch(e){}
var d=t==="dark"||(t==="auto"&&window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches);
var el=document.documentElement;el.setAttribute("data-theme",d?"dark":"light");el.setAttribute("data-theme-mode",t);
var f="serif",z="m";try{f=localStorage.getItem("phm_font")||"serif";z=localStorage.getItem("phm_size")||"m";}catch(e){}
el.setAttribute("data-font",f==="sans"||f==="kai"?f:"serif");el.setAttribute("data-size",z==="s"||z==="l"?z:"m");})();</script>
<link rel="stylesheet" href="/css/base.css?v=V0.22.5.0">
<link rel="stylesheet" href="/css/ui-kit.css?v=V0.22.5.0">
<style>
.ag-wrap{max-width:820px;margin:0 auto;padding:18px 16px 90px}
.ag-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.ag-head h1{font-size:17px;margin:0;font-weight:650}
.ag-badge{font-size:11.5px;color:var(--fg3);border:1px solid var(--line2);
  border-radius:99px;padding:2px 9px;font-variant-numeric:tabular-nums}
.ag-badge[data-ok="0"]{color:var(--err);border-color:color-mix(in srgb,var(--err) 40%,var(--line2))}
#log{display:flex;flex-direction:column;gap:12px;min-height:120px}
.msg{border-radius:10px;padding:10px 13px;font-size:13.5px;line-height:1.7}
.msg.user{background:color-mix(in srgb,var(--brand) 8%,var(--card));border:1px solid var(--line2);
  align-self:flex-end;max-width:86%;white-space:pre-wrap}
.msg.bot{background:var(--card);border:1px solid var(--line2);white-space:pre-wrap}
.msg.bot.err{color:var(--err);font-family:var(--mono,ui-monospace,monospace);font-size:12.5px}
.msg .tool{font-size:12px;color:var(--fg3);font-family:var(--mono,ui-monospace,monospace)}
.msg pre{background:var(--bg);border:1px solid var(--line2);border-radius:8px;
  padding:9px 11px;overflow-x:auto;font-size:12.5px;margin:8px 0}
.ag-bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);
  border-top:1px solid var(--line2);padding:10px 16px}
.ag-bar .in{max-width:820px;margin:0 auto;display:flex;gap:9px;align-items:flex-end}
#q{flex:1;background:var(--card2);color:var(--fg);border:1px solid var(--line2);
  border-radius:9px;padding:9px 12px;font:inherit;resize:none;min-height:42px;max-height:150px;outline:none}
#q:focus{border-color:var(--brand)}
#send{height:42px;padding:0 20px;border-radius:9px;border:0;background:var(--brand);
  color:var(--brand-ink);font:inherit;font-weight:600;cursor:pointer}
#send:disabled{opacity:.45;cursor:not-allowed}
.ag-hint{max-width:820px;margin:6px auto 0;font-size:11.5px;color:var(--fg3)}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tools button{font-size:12px;padding:4px 10px;border-radius:99px;border:1px solid var(--line2);
  background:var(--card);color:var(--fg2);cursor:pointer}
.tools button:hover{border-color:var(--brand);color:var(--fg)}
/* 审批卡片：改动之前就要让人看见改什么 */
.gate{border:1px solid color-mix(in srgb,var(--brand) 45%,var(--line2));border-radius:10px;
  padding:11px 13px;background:color-mix(in srgb,var(--brand) 6%,var(--card));font-size:13px}
.gate .t{font-weight:600;margin-bottom:6px}
.gate .p{font-size:12px;color:var(--fg2);font-family:var(--mono,ui-monospace,monospace);
  white-space:pre-wrap;max-height:120px;overflow:auto;margin-bottom:9px}
.gate .b{display:flex;gap:8px}
.gate .b button{font:inherit;font-size:12.5px;padding:5px 14px;border-radius:7px;cursor:pointer;border:1px solid var(--line2);background:var(--card);color:var(--fg)}
.gate .b button.yes{background:var(--brand);color:var(--brand-ink);border-color:transparent;font-weight:600}
</style>
</head>
<body>
<div class="wrap"><nav id="nav"></nav></div>

<div class="ag-wrap">
  <div class="ag-head">
    <h1 data-i18n="ag.h1">AI 写谱</h1>
    <span class="ag-badge" id="stat" data-i18n="ag.checking">检查中…</span>
  </div>

  <div class="tools">
    <button data-p="帮我写一张 4 分音符的简单谱，BPM 120，先给我看看结构" data-i18n="ag.preset1">简单骨架</button>
    <button data-p="副歌部分密度加大，判定线跟着鼓点转起来" data-i18n="ag.preset2">副歌加强</button>
    <button data-p="跑一遍体检，哪一项不过就改到过为止" data-i18n="ag.preset3">自检并修正</button>
  </div>

  <div id="log"></div>
</div>

<div class="ag-bar">
  <div class="in">
    <textarea id="q" rows="1" placeholder="说说你想要什么样的谱…（Enter 发送 / Shift+Enter 换行）" data-i18n-ph="ag.placeholder"></textarea>
    <button id="send" data-i18n="ag.send">发送</button>
  </div>
  <div class="ag-hint">
    模型只会通过**审批过的命令**改谱面。Key 在服务端，浏览器拿不到。
  </div>
</div>

<script type="module" src="/js/agent-page.js?v=V0.22.5.0"></script>
</body>
</html>
