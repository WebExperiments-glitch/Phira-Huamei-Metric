<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="app-version" content="V0.13.0.0">
<title>API 控制台 · P.H.M.</title>
<meta name="description" content="P.H.M. API 控制台：管理 API Key、查看调用用量。">
<script>(function(){var t="auto";try{t=localStorage.getItem("phm_theme")||"auto";}catch(e){}
var d=t==="dark"||(t==="auto"&&window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches);
var el=document.documentElement;el.setAttribute("data-theme",d?"dark":"light");el.setAttribute("data-theme-mode",t);
var f="serif",z="m";try{f=localStorage.getItem("phm_font")||"serif";z=localStorage.getItem("phm_size")||"m";}catch(e){}
el.setAttribute("data-font",f==="sans"||f==="kai"?f:"serif");el.setAttribute("data-size",z==="s"||z==="l"?z:"m");})();</script>
<link rel="stylesheet" href="/css/base.css?v=V0.13.0.0">
<link rel="stylesheet" href="/css/ui-kit.css?v=V0.13.0.0">
<link rel="stylesheet" href="/css/api.css?v=V0.13.0.0">
<script defer src="https://cdn.jsdelivr.net/npm/@tencent-ai/workbuddy-cloud-sdk@0.1.3/lib/index.global.js"
  integrity="sha384-z77MUA3IAqENYJOfGtmBKISLXkWlqVx8VWWQn9qxPwllJp6t43aKUFFMei2TYJWM"
  crossorigin="anonymous"></script>
</head>
<body>
<div class="wrap"><nav id="nav"></nav></div>
<div class="apiwrap" style="grid-template-columns:minmax(0,1fr)">
  <main class="api-main">
    <h1>API 控制台</h1>
    <p class="lead">管理 API Key、查看调用用量。使用站点账号登录；Key 明文只在创建时显示一次。</p>

    <div id="authGate" class="console-empty">正在检查登录状态…</div>

    <div id="consoleBody" style="display:none">
      <div class="console-bar">
        <div class="console-card" style="flex:1 1 auto;padding:10px 14px">
          <span class="k">当前账号</span>
          <b id="acctEmail" style="margin-left:8px"></b>
          <button class="api-btn sm" id="logout" style="float:right">退出登录</button>
        </div>
      </div>

      <div class="console-grid">
        <div class="console-card"><div class="k">今日调用</div><div class="v" id="uToday">—</div><div class="n">00:00 起（北京时间）</div></div>
        <div class="console-card"><div class="k">近 7 天</div><div class="v" id="uWeek">—</div></div>
        <div class="console-card"><div class="k">近 30 天</div><div class="v" id="uMonth">—</div></div>
        <div class="console-card"><div class="k">有效 Key</div><div class="v" id="uKeys">—</div><div class="n">上限 100</div></div>
      </div>

      <h2 id="keys" style="border-top:none;padding-top:0">API Keys</h2>
      <div class="console-bar">
        <input id="keyName" maxlength="40" placeholder="给新 Key 起个名字（例如：笔记本 / CI）">
        <button class="api-btn primary" id="createKey">创建 API Key</button>
      </div>
      <div class="status-line" id="keyStatus"></div>
      <div id="oneKey"></div>

      <div style="overflow:auto">
        <table class="key-table">
          <thead><tr><th>名称</th><th>Tracking ID</th><th>Key</th><th>创建日期</th><th>最近使用</th><th></th></tr></thead>
          <tbody id="keyRows"><tr><td colspan="6" class="console-empty">加载中…</td></tr></tbody>
        </table>
      </div>

      <p class="api-note" style="margin-top:18px">
        用量按「账号」汇总；分析接口另有 <b>200 次/天</b> 的额度。Key 泄露后请立即删除（吊销），
        删除不会抹掉历史用量记录。文档见 <a href="/developers">/developers</a>。
      </p>
    </div>
  </main>
</div>

<footer>
  <div class="row" style="justify-content:space-between">
    <span>P.H.M. Standard · API 控制台</span>
    <span><a href="/developers">开发者文档</a> · <a href="/">返回站点</a> · <a href="/privacy">隐私政策</a></span>
  </div>
</footer>

<script type="module">
import { renderNav } from '/js/ui.js?v=V0.13.0.0';
renderNav();

const CLOUD_CFG = {
  endpoint: 'https://phm.app.workbuddy.host',
  publishableKey: 'wbpk_TRm3Cbt5VeYHHDwUL854jr_5Xi69EqYG18sPzQnMMJhJr08x67NoE3b',
};
const $ = s => document.querySelector(s);
let cloud = null, account = null;

function setStatus(msg, isErr) {
  const el = $('#keyStatus');
  if (el) { el.textContent = msg || ''; el.className = 'status-line' + (isErr ? ' err' : ''); }
}

async function api(path, opts) {
  const token = await getIdToken();
  if (!token) throw new Error('account_token_required');
  const r = await fetch('/api/v1' + path, Object.assign({
    headers: { 'x-hm-token': token, 'content-type': 'application/json' },
  }, opts || {}));
  let j = null;
  try { j = await r.json(); } catch (e) {}
  if (!r.ok) {
    const msg = j && j.error ? (j.error.code + ': ' + j.error.message) : ('HTTP ' + r.status);
    throw new Error(msg);
  }
  return j;
}

async function getIdToken() {
  try { return await cloud.auth.getAccessToken(); } catch (e) { return null; }
}

function fmtDate(v) {
  if (!v) return '—';
  const d = new Date(v);
  if (isNaN(d)) return '—';
  return d.toISOString().slice(0, 10);
}

function renderLoggedOut() {
  $('#authGate').innerHTML = '需要先登录站点账号才能管理 API Key。'
    + '<div style="margin-top:12px"><a class="api-btn primary" href="/app#account">去登录 / 注册 →</a>'
    + ' <a class="api-btn" href="/developers">先看文档</a></div>';
  $('#consoleBody').style.display = 'none';
}

async function renderConsole() {
  $('#authGate').style.display = 'none';
  $('#consoleBody').style.display = '';
  $('#acctEmail').textContent = account.email || account.username || account.id || '已登录';

  const usage = await api('/usage');
  $('#uToday').textContent = usage.today == null ? '—' : usage.today;
  $('#uWeek').textContent = usage.week == null ? '—' : usage.week;
  $('#uMonth').textContent = usage.month == null ? '—' : usage.month;

  const data = await api('/keys');
  const keys = (data && data.keys) || [];
  $('#uKeys').textContent = keys.filter(k => !k.revoked_at).length;
  const tbody = $('#keyRows');
  tbody.innerHTML = '';
  if (!keys.length) {
    tbody.innerHTML = '<tr><td colspan="6" class="console-empty">还没有 Key，创建一个吧。</td></tr>';
    return;
  }
  for (const k of keys) {
    const tr = document.createElement('tr');
    const revoked = !!k.revoked_at;
    tr.innerHTML = '<td>' + escapeHtml(k.name) + (revoked ? ' <span class="k">(已吊销)</span>' : '') + '</td>'
      + '<td class="mono">' + k.id + '</td>'
      + '<td class="mono">' + escapeHtml(k.hint) + '</td>'
      + '<td>' + fmtDate(k.created_at) + '</td>'
      + '<td>' + fmtDate(k.last_used_at) + '</td>'
      + '<td><div class="key-actions"></div></td>';
    const actions = tr.querySelector('.key-actions');
    if (!revoked) {
      const ren = document.createElement('button');
      ren.className = 'api-btn sm'; ren.textContent = '改名';
      ren.onclick = async function () {
        const name = prompt('新的名称', k.name);
        if (!name) return;
        try { await api('/keys/' + k.id, { method: 'PATCH', body: JSON.stringify({ name }) }); await renderConsole(); }
        catch (e) { setStatus(String(e.message || e), true); }
      };
      const del = document.createElement('button');
      del.className = 'api-btn sm danger'; del.textContent = '删除';
      del.onclick = async function () {
        if (!confirm('删除后这个 Key 立即失效，确定？')) return;
        try { await api('/keys/' + k.id, { method: 'DELETE' }); await renderConsole(); }
        catch (e) { setStatus(String(e.message || e), true); }
      };
      actions.append(ren, del);
    }
    tbody.appendChild(tr);
  }
}

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

async function boot() {
  if (!window.WorkBuddyCloud || !window.WorkBuddyCloud.createWorkBuddyCloud) {
    $('#authGate').textContent = '云 SDK 加载失败，请刷新页面。';
    return;
  }
  cloud = window.WorkBuddyCloud.createWorkBuddyCloud(CLOUD_CFG);
  try {
    const r = await cloud.auth.getUser();
    account = (r && (r.data ? (r.data.user || r.data) : r.user)) || null;
  } catch (e) { account = null; }
  if (!account) return renderLoggedOut();
  try {
    await renderConsole();
  } catch (e) {
    renderLoggedOut();
    $('#authGate').textContent = '登录状态无效或已过期，请重新登录。';
    $('#authGate').innerHTML += '<div style="margin-top:12px"><a class="api-btn primary" href="/app#account">去登录 →</a></div>';
  }
}

$('#logout').addEventListener('click', async function () {
  try { if (cloud && cloud.auth && cloud.auth.signOut) await cloud.auth.signOut(); } catch (e) {}
  location.reload();
});

$('#createKey').addEventListener('click', async function () {
  const name = ($('#keyName').value || '').trim() || 'default';
  setStatus('创建中…');
  try {
    const j = await api('/keys', { method: 'POST', body: JSON.stringify({ name }) });
    $('#oneKey').innerHTML = '<div class="onekey"><b>Key 已创建，只显示这一次：</b>'
      + '<code id="oneKeyVal">' + escapeHtml(j.key) + '</code>'
      + '<button class="api-btn sm" id="copyKey">复制</button>'
      + '<div class="k" style="margin-top:6px">' + escapeHtml(j.hint) + ' · 请保存到安全的地方</div></div>';
    $('#copyKey').onclick = async function () {
      try { await navigator.clipboard.writeText(j.key); $('#copyKey').textContent = '已复制'; }
      catch (e) { setStatus('复制失败，请手动选中', true); }
    };
    $('#keyName').value = '';
    setStatus('创建成功');
    await renderConsole();
  } catch (e) { setStatus(String(e.message || e), true); }
});

boot();
</script>
</body>
</html>
