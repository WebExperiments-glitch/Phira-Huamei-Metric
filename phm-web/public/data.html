<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="app-version" content="V0.9.1.0">
<title>数据管理 · P.H.M.</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d1117'/%3E%3Ctext x='16' y='23' font-size='19' font-family='sans-serif' font-weight='bold' text-anchor='middle' fill='%23e8a33d'%3EP%3C/text%3E%3C/svg%3E">
<meta name="description" content="P.H.M. 共享定数缓存的数据管理：分页浏览、排序、过滤，查看每一行的双标度值与产生它的引擎版本。">
<meta name="robots" content="noindex">
<!-- 主题：必须**同步内联**在样式表之前 —— 模块是异步的，等它跑完页面
     已经按默认色画过一帧了，刷新时就会闪一下（FOUC）。
     读的键与 /js/settings.js 的 KEYS.theme 一致（phm_theme）。 -->
<script>(function(){var t="auto";try{t=localStorage.getItem("phm_theme")||"auto";}catch(e){}
var d=t==="dark"||(t==="auto"&&window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches);
var el=document.documentElement;el.setAttribute("data-theme",d?"dark":"light");el.setAttribute("data-theme-mode",t);})();</script>
<link rel="stylesheet" href="/css/base.css?v=V0.9.1.0">
<style>
.sumgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:10px;margin:12px 0}
.sum{background:var(--card2);border-radius:10px;padding:10px 13px}
.sum .k{font-size:11.5px;color:var(--fg3)}
.sum .v{font-size:21px;font-variant-numeric:tabular-nums;margin-top:2px}
.sum .n{font-size:11px;color:var(--fg3)}

.bar{display:flex;height:22px;border-radius:6px;overflow:hidden;margin:10px 0 6px;background:var(--card2)}
.bar i{display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--on-color);font-weight:600}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:14px 0 10px}
.toolbar .inp{padding:6px 10px;font-size:13px}
.toolbar select.inp{padding:6px 8px}

table.tbl{font-size:12.5px}
table.tbl th{cursor:pointer;user-select:none;white-space:nowrap;position:relative;padding-right:16px}
table.tbl th:hover{color:var(--fg)}
table.tbl th .ar{position:absolute;right:4px;opacity:.9}
table.tbl th.no{cursor:default}
table.tbl td{white-space:nowrap}
table.tbl td.nm{max-width:230px;overflow:hidden;text-overflow:ellipsis}
.tier{display:inline-block;min-width:24px;text-align:center;padding:0 5px;border-radius:5px;
  font-size:10.5px;font-weight:600;color:var(--on-color)}
.mono2{font-family:var(--mono);font-size:11.5px;color:var(--fg3)}
.gap-pos{color:var(--green);font-size:11px}
.gap-neg{color:var(--red);font-size:11px}
.stale{color:var(--amber);font-size:11px}

</style>
</head>
<body>
<div class="wrap wide">

<nav id="nav"></nav>

<div class="card">
  <div class="row" style="justify-content:space-between;align-items:baseline">
    <h2 style="margin:0" data-i18n="dt.title"></h2>
    <span class="dim2" style="font-size:12px" id="engchip">—</span>
  </div>
  <div class="sub" data-i18n-html="dt.sub"></div>
  <div class="sumgrid" id="sum"></div>
  <div class="bar" id="lbar"></div>
  <div id="bmeta" class="dim2" style="font-size:11.5px"></div>
</div>

<div class="card">
  <div class="toolbar">
    <input class="inp" id="q" data-i18n-ph="dt.search.ph" autocomplete="off" style="min-width:170px">
    <select class="inp" id="level">
      <option value="" data-i18n="dt.filter.allTier"></option>
      <option>EZ</option><option>HD</option><option>IN</option><option>AT</option><option>SP</option>
    </select>
    <select class="inp" id="only">
      <option value="" data-i18n="dt.filter.allKind"></option>
      <option value="official" data-i18n="dt.filter.official"></option>
      <option value="stale" data-i18n="dt.filter.stale"></option>
    </select>
    <button class="btn sm" id="reset" data-i18n="c.reset"></button>
    <span class="dim2" style="font-size:12px;margin-left:auto" id="hint"></span>
  </div>
  <div id="tbl"><div class="empty" data-i18n="dt.reading"></div></div>
  <div id="pgwrap"></div>
</div>

<footer>
  <div data-i18n-html="dt.foot.src"></div>
  <div class="fd" data-i18n-html="dt.foot.note"></div>
</footer>

</div>

<script type="module">
import { renderNav, esc, f2, lvTag, tierColor, pagerHTML, wirePager,
         applyStatic, t, onLangChange } from '/js/ui.js';

renderNav('data');
applyStatic();
const $ = s => document.querySelector(s);

/* 页面状态。全部集中在这里 —— 翻页 / 排序 / 过滤都只改这个对象再重渲染，
   否则会出现"改了页码但筛选条件丢了"这类经典 bug。 */
const S = { page: 1, pageSize: 50, sort: 'chart_id', order: 'asc', q: '', level: '', only: '' };
const SIZES = [25, 50, 100, 200];
/* 列定义：第三列是**词条名**而不是字面量 —— 表头是 JS 渲染的，
   写死中文的话切语言时不会变（本页踩过这个类别的坑）。 */
const COLS = [
  ['chart_id', 'dt.col.chart_id', 'num'],
  ['name', 'dt.col.name', ''],
  ['level', 'dt.col.level', ''],
  ['difficulty', 'dt.col.difficulty', 'r'],
  ['ref_const', 'dt.col.ref_const', 'r'],
  ['ref_official', 'dt.col.ref_official', 'r'],
  ['ps_score', 'dt.col.ps_score', 'r'],
  ['nps', 'dt.col.nps', 'r'],
  ['notes', 'dt.col.notes', 'r'],
  ['engine_build', 'dt.col.engine_build', ''],
  ['computed_at', 'dt.col.computed_at', ''],
];

let LAST = null;
let reqSeq = 0;

/* ── 汇总 ── */
/* 数字只取一次（SUM），画的时候才取词条 —— 这样切语言只重画标签，不打接口。 */
let SUM = null;

function paintSummary() {
  if (!SUM) return;
  const s = SUM;
  $('#engchip').textContent = t('dt.eng', { v: s.engineVer || '—' });
  const stale = Object.entries(s.byBuild || {})
    .filter(([k]) => k !== s.engineVer).reduce((a, [, n]) => a + n, 0);
  const cell = (k, v, n) => '<div class="sum"><div class="k">' + esc(k) + '</div>'
    + '<div class="v">' + v + '</div>' + (n ? '<div class="n">' + esc(n) + '</div>' : '') + '</div>';
  $('#sum').innerHTML =
    cell(t('dt.sum.rows'), s.total)
    + cell(t('dt.sum.dual'), s.withOfficial,
        t('dt.sum.dual.n', { p: s.total ? Math.round(s.withOfficial / s.total * 100) : 0 }))
    + cell(t('dt.sum.diff'), s.withDiff, t('dt.sum.diff.n'))
    + cell(t('dt.sum.stale'), stale, stale ? t('dt.sum.stale.n') : t('dt.sum.fresh.n'));
  /* 档位分布条 */
  const order = ['EZ', 'HD', 'IN', 'AT', 'SP', '?'];
  const tl = s.total || 1;
  $('#lbar').innerHTML = order.filter(x => (s.byLevel || {})[x]).map(x =>
    '<i style="width:' + ((s.byLevel[x] / tl) * 100) + '%;background:' + tierColor(x) + ';color:var(--on-color)">'
    + ((s.byLevel[x] / tl) > 0.07 ? x + ' ' + s.byLevel[x] : '') + '</i>').join('');
  $('#bmeta').textContent = order.filter(x => (s.byLevel || {})[x])
    .map(x => x + ' × ' + s.byLevel[x]).join('　·　');
}

(async function summary() {
  try {
    const r = await fetch('/api/summary');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    SUM = await r.json();
    paintSummary();
  } catch (e) {
    $('#sum').innerHTML = '<div class="sum"><div class="k">' + esc(t('dt.sum.failTitle')) + '</div>'
      + '<div class="v">—</div><div class="n">' + esc(t('dt.sum.fail')) + '</div></div>';
  }
})();

/* ── 表格 ── */
async function fetchPage() {
  const my = ++reqSeq;
  $('#tbl').innerHTML = '<div class="empty">' + esc(t('dt.reading')) + '</div>';
  const qs = new URLSearchParams({
    page: S.page, pageSize: S.pageSize, sort: S.sort, order: S.order,
  });
  if (S.q) qs.set('q', S.q);
  if (S.level) qs.set('level', S.level);
  if (S.only) qs.set('only', S.only);
  try {
    const r = await fetch('/api/charts?' + qs);
    const j = await r.json();
    if (my !== reqSeq) return;                     /* 已有更新的请求在跑，丢弃本次 */
    if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
    LAST = j;
    render(j);
    syncURL();
  } catch (e) {
    if (my !== reqSeq) return;
    $('#tbl').innerHTML = '<div class="status err">' + esc(t('dt.fail', { e: e.message || e })) + '</div>';
    $('#pgwrap').innerHTML = '';
  }
}

function render(j) {
  const rows = j.rows || [];
  $('#hint').textContent = t('dt.hint', { a: rows.length, b: j.pageSize });

  if (!rows.length) {
    $('#tbl').innerHTML = '<div class="empty">' + esc(t('dt.empty')) + '</div>';
    $('#pgwrap').innerHTML = pagerHTML({ page: 1, pages: 1, total: 0, pageSize: j.pageSize, sizes: SIZES });
    wirePager($('#pgwrap'), go, setSize);
    return;
  }

  let h = '<table class="tbl"><thead><tr>';
  for (const [key, labelKey, cls] of COLS) {
    const on = S.sort === key;
    h += '<th class="' + cls + (key === 'computed_at' ? ' no' : '') + '" data-sort="' + key + '">'
      + esc(t(labelKey)) + (on ? '<span class="ar">' + (S.order === 'asc' ? '↑' : '↓') + '</span>' : '') + '</th>';
  }
  h += '</tr></thead><tbody>';
  for (const r of rows) {
    const tg = lvTag(r.level);
    const d = +r.difficulty;
    const hasD = d > 0 && d <= 20;
    const pm = r.ref_const != null ? +r.ref_const : null;
    const po = r.ref_official != null ? +r.ref_official : null;
    /* 社区共识 vs 官谱标度之差 —— 这一列是这个工具最独有的信息 */
    const gap = (pm != null && po != null) ? pm - po : null;
    const stale = r.engine_build !== j.engineVer;
    h += '<tr>'
      + '<td class="num mono2">' + r.chart_id + '</td>'
      + '<td class="nm" title="' + esc(r.name || '') + '">' + esc(String(r.name || '').slice(0, 38)) + '</td>'
      + '<td><span class="tier" style="background:' + tierColor(tg) + '">' + esc(tg) + '</span></td>'
      + '<td class="r num">' + (hasD ? f2(d) : '—') + '</td>'
      + '<td class="r num" style="color:var(--brand)">' + f2(pm) + '</td>'
      + '<td class="r num">' + f2(po)
      + (gap != null ? ' <span class="' + (gap >= 0 ? 'gap-pos' : 'gap-neg') + '">'
          + (gap >= 0 ? '+' : '') + gap.toFixed(1) + '</span>' : '') + '</td>'
      + '<td class="r num">' + f2(r.ps_score) + '</td>'
      + '<td class="r num">' + f2(r.nps) + '</td>'
      + '<td class="r num">' + (r.notes == null ? '—' : r.notes) + '</td>'
      + '<td class="mono2">' + (stale
          ? '<span class="stale" title="' + esc(t('dt.stale.tip')) + '">' + esc(r.engine_build || t('dt.stale.old')) + '</span>'
          : '<span style="color:var(--ok)">' + esc(t('dt.latest')) + '</span>') + '</td>'
      + '<td class="mono2">' + esc(String(r.computed_at || '').replace('T', ' ').slice(5, 16)) + '</td>'
      + '</tr>';
  }
  h += '</tbody></table>';
  $('#tbl').innerHTML = h;

  /* 表头排序：点同一个字段切换升降序 */
  $('#tbl').querySelectorAll('th[data-sort]:not(.no)').forEach(th =>
    th.addEventListener('click', () => {
      const k = th.getAttribute('data-sort');
      if (S.sort === k) S.order = S.order === 'asc' ? 'desc' : 'asc';
      else { S.sort = k; S.order = 'desc'; }         /* 换字段时默认降序（数值列更常用） */
      S.page = 1;
      load();
    }));

  $('#pgwrap').innerHTML = pagerHTML({
    page: j.page, pages: j.pages, total: j.total, pageSize: j.pageSize, sizes: SIZES,
  });
  wirePager($('#pgwrap'), go, setSize);
}

const go = p => { S.page = p; load(); };
const setSize = n => { S.pageSize = n; S.page = 1; load(); };

/* 过滤：输入防抖 300ms，别每敲一个字就打一次接口 */
let deb;
$('#q').addEventListener('input', e => {
  clearTimeout(deb);
  deb = setTimeout(() => { S.q = e.target.value.trim(); S.page = 1; load(); }, 320);
});
$('#level').addEventListener('change', e => { S.level = e.target.value; S.page = 1; load(); });
$('#only').addEventListener('change', e => { S.only = e.target.value; S.page = 1; load(); });
$('#reset').addEventListener('click', () => {
  S.q = ''; S.level = ''; S.only = ''; S.page = 1; S.sort = 'chart_id'; S.order = 'asc';
  $('#q').value = ''; $('#level').value = ''; $('#only').value = '';
  load();
});

/* 统一入口：取数 + 同步 URL */
function load() { return fetchPage(); }

/* URL 同步：把当前视图写进地址栏，这样"第 7 页、只看 AT"可以直接分享/刷新。
   用 replaceState 而不是 pushState —— 否则每翻一页都往历史里塞一条，返回键会很难用。 */
function syncURL() {
  const p = new URLSearchParams();
  if (S.page !== 1) p.set('page', S.page);
  if (S.pageSize !== 50) p.set('size', S.pageSize);
  if (S.sort !== 'chart_id') p.set('sort', S.sort);
  if (S.order !== 'asc') p.set('order', S.order);
  if (S.q) p.set('q', S.q);
  if (S.level) p.set('level', S.level);
  if (S.only) p.set('only', S.only);
  const qs = p.toString();
  history.replaceState(null, '', location.pathname + (qs ? '?' + qs : ''));
}
/* 从 URL 恢复初始状态 */
(function initFromURL() {
  const p = new URLSearchParams(location.search);
  if (p.get('page')) S.page = Math.max(1, parseInt(p.get('page'), 10) || 1);
  if (p.get('size') && SIZES.includes(+p.get('size'))) S.pageSize = +p.get('size');
  if (p.get('sort')) S.sort = p.get('sort');
  if (p.get('order') === 'desc') S.order = 'desc';
  if (p.get('q')) { S.q = p.get('q'); $('#q').value = S.q; }
  if (p.get('level')) { S.level = p.get('level'); $('#level').value = S.level; }
  if (p.get('only')) { S.only = p.get('only'); $('#only').value = S.only; }
})();

load();

/* 语言一变：静态部分 applyStatic 处理，汇总卡与表头是 JS 画的，要自己重画。
   ⚠ 只重画已有的数据（LAST / SUM），**不重新打接口** —— 切语言不该产生网络请求。 */
onLangChange(function () {
  applyStatic();
  paintSummary();
  if (LAST) render(LAST);
});
</script>
</body>
</html>
