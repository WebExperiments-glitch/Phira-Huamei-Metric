<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 版本号由服务端替换（__APP_VER__）——与各页 <meta name="app-version"> 同源 -->
<meta name="app-version" content="__APP_VER__">
<meta name="robots" content="noindex">
<title>未启用的功能 · P.H.M.</title>
<!-- 主题防闪烁：必须**同步内联**在样式表之前。键名与 js/settings.js 的 KEYS 一致。
     （lint-slop 对 .html 里的这段有专门豁免，别改成模块 —— 模块是异步的，会闪一帧。） -->
<script>(function(){var d=document.documentElement,t="auto",f="serif",z="m";
try{t=localStorage.getItem("phm_theme")||"auto";
f=localStorage.getItem("phm_font")||"serif";
z=localStorage.getItem("phm_size")||"m";}catch(e){}
var dark=t==="dark"||(t==="auto"&&window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches);
d.setAttribute("data-theme",dark?"dark":"light");
d.setAttribute("data-theme-mode",t==="light"||t==="dark"?t:"auto");
d.setAttribute("data-font",f==="sans"||f==="kai"?f:"serif");
d.setAttribute("data-size",z==="s"||z==="l"?z:"m");})();</script>
<link rel="stylesheet" href="/css/base.css?v=__APP_VER__">
<link rel="stylesheet" href="/css/ui-kit.css?v=__APP_VER__">
</head>
<body>
<div class="wrap">
<nav id="nav"></nav>
<main style="max-width:640px;margin:8vh auto;padding:0 20px;line-height:1.75">
  <h1 style="font-size:1.5rem;margin:0 0 14px">这个部署里没有启用这些功能</h1>
  <p>谱面分析、规则写谱、谱面包这三个<b>不依赖数据库</b>的功能可以正常使用；
     账号、成绩、数据管理、状态页与开放 API 需要数据库支撑，<b>在这个部署里没有启用</b>。</p>
  <p>需要完整功能请到：<a href="__RETIRE_URL__" rel="noopener">__RETIRE_URL__</a></p>
  <p style="margin-top:26px">
    <a class="btn" href="/app">去谱面分析</a>
    <a class="btn ghost" href="/rulechart" style="margin-left:8px">规则写谱</a>
    <a class="btn ghost" href="/packs" style="margin-left:8px">谱面包</a>
  </p>
</main>
</div>
<script type="module">
  import { renderNav, applyStatic } from '/js/ui.js?v=__APP_VER__';
  renderNav(); applyStatic();
</script>
</body>
</html>
