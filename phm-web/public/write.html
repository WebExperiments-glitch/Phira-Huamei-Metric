<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="app-version" content="V0.22.4.0">
<title>AI 写谱 · P.H.M.</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d1117'/%3E%3Ctext x='16' y='23' font-size='19' font-family='sans-serif' font-weight='bold' text-anchor='middle' fill='%23e8a33d'%3EP%3C/text%3E%3C/svg%3E">

var d=t==="dark"||(t==="auto"&&window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches);
var el=document.documentElement;el.setAttribute("data-theme",d?"dark":"light");el.setAttribute("data-theme-mode",t);
var f="serif",z="m";try{f=localStorage.getItem("phm_font")||"serif";z=localStorage.getItem("phm_size")||"m";}catch(e){}
el.setAttribute("data-font",f==="sans"||f==="kai"?f:"serif");el.setAttribute("data-size",z==="s"||z==="l"?z:"m");})();</script>
<link rel="stylesheet" href="/css/base.css?v=V0.22.4.0">
<link rel="stylesheet" href="/css/ui-kit.css?v=V0.22.4.0">
<style>
/* ==============================================================
 * 结构借 DeepSeek：窄居中单列(740) / 留白多 / 少装饰 / 正文 16·1.75·400
 * 配色与标题保留 P.H.M.：棕 + 宋体
 * ============================================================== */
html,body{height:100%}
body{height:100dvh;display:flex;flex-direction:column;overflow:hidden;margin:0}

/* ⚠ 导航的 .wrap 是 flex 子项：base.css 里它是 "margin:0 auto + max-width" 的普通块，
   进了 flex 列之后宽度算法变了，左边缘比别页多 25px（冒烟测出来的）。
   强制它按普通块参与布局。 */
body>.wrap{flex:none;width:100%}

.wr-main{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}

/* 空态：一有消息就整体退场（不再挂在上面） */
.wr-empty{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:18px;padding:0 24px 10vh;text-align:center}
.wr-empty[hidden]{display:none}
.wr-empty .mark{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;
  background:color-mix(in srgb,var(--brand) 14%,var(--card));color:var(--brand);
  font-family:var(--serif,Georgia,serif);font-size:20px;font-weight:700}
.wr-empty h1{margin:0;font-family:var(--serif,Georgia,serif);font-size:26px;font-weight:600;
  letter-spacing:.01em;line-height:1.35}
.wr-empty h1 em{font-style:normal;color:var(--brand)}
.wr-empty p{margin:0;font-size:14px;color:var(--fg3);line-height:1.8;max-width:430px}
/* 实验性说明：用琥珀色边框，一眼能看出这不是"成品功能"的承诺 */
.wr-empty .exp{margin-top:14px;padding:9px 12px;border-left:2px solid var(--warn);
  border-radius:0 6px 6px 0;background:color-mix(in srgb,var(--warn) 8%,var(--card));
  font-size:12.5px;color:var(--fg3);line-height:1.7;max-width:430px}
.wr-empty .exp b{color:var(--warn);font-weight:600;margin-right:2px}

/* 对话：窄居中单列，自己在输入框上方滚 */
.wr-log{flex:1;min-height:0;overflow-y:auto;padding:28px 24px 12px;
  display:flex;flex-direction:column;gap:26px}
.wr-log[hidden]{display:none}
.msg{width:100%;max-width:740px;margin:0 auto}
.msg.user{display:flex;justify-content:flex-end}
/* 用户气泡：实心暖灰、无描边（brand 与 card 混色，跟随主题，不写死色值） */
.msg.user .body{background:color-mix(in srgb,var(--brand) 12%,var(--card));
  border-radius:18px;padding:11px 16px;max-width:82%;white-space:pre-wrap;
  font-size:16px;line-height:1.75;color:var(--fg-prose)}

/* AI 回复：不要气泡，就是正文 */
.msg.bot .body{font-size:16px;line-height:1.75;font-weight:400;color:var(--fg-prose)}
.msg.bot .body p{margin:0 0 12px}
.msg.bot .body p:last-child{margin-bottom:0}
.msg.bot .body h1,.msg.bot .body h2,.msg.bot .body h3{
  font-family:var(--serif,Georgia,serif);font-weight:600;line-height:1.4;
  margin:20px 0 10px;color:var(--fg)}
.msg.bot .body h1{font-size:20px}
.msg.bot .body h2{font-size:18px}
.msg.bot .body h3{font-size:16.5px}
.msg.bot .body ul,.msg.bot .body ol{margin:0 0 12px;padding-left:1.2em}
.msg.bot .body li{margin:4px 0}
.msg.bot .body strong{font-weight:600;color:var(--fg)}
.msg.bot .body code{background:var(--card2);padding:1.5px 5px;border-radius:4px;
  font-size:.88em;font-family:var(--mono,ui-monospace,monospace)}
.msg.bot .body pre{background:var(--card2);border-radius:10px;padding:12px 14px;
  overflow-x:auto;font-size:13px;line-height:1.6;margin:10px 0;
  font-family:var(--mono,ui-monospace,monospace)}
.msg.bot .body pre code{background:none;padding:0}
.msg.bot .body a{color:var(--brand);text-decoration:underline;text-underline-offset:2px}

/* 思考：灰色小字，默认折叠，带用时 */
.think{margin:0 0 12px}
.think summary{cursor:pointer;list-style:none;user-select:none;
  font-size:12.5px;color:var(--fg4);display:inline-flex;align-items:center;gap:4px}
.think summary::-webkit-details-marker{display:none}
.think summary::after{content:'▾';font-size:9px;opacity:.7}
.think[open] summary::after{content:'▴'}
.think .tx{font-size:13px;color:var(--fg4);white-space:pre-wrap;line-height:1.8;
  margin-top:8px;padding-left:10px;border-left:1px solid var(--line2)}

/* 工具：一行，极淡 */
.tool{display:flex;align-items:baseline;gap:8px;font-size:12.5px;color:var(--fg4);
  font-family:var(--mono,ui-monospace,monospace);padding:1px 0}
.tool .ic{width:11px;flex:none;text-align:center;opacity:.8}
.tool.ok .ic{color:var(--ok)}
.tool.err .ic{color:var(--err)}
.tool .nm{color:var(--fg3)}
.tool .dt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;opacity:.85}
/* 折叠后的「还有 N 步」：一行小字，点开才看全部 */
.tool-more{display:inline-block;margin:2px 0 4px;padding:0;border:0;background:none;
  font-size:12px;color:var(--fg4);cursor:pointer;font-family:inherit}
.tool-more:hover{color:var(--brand)}

/* AI 下方的小动作：复制 / 重试（悬停才出现，不抢注意力） */
.acts{display:flex;gap:12px;margin-top:10px;opacity:0;transition:opacity .15s}
.msg.bot:hover .acts,.acts:focus-within{opacity:1}
.acts button{background:none;border:0;color:var(--fg4);font-size:12px;cursor:pointer;
  padding:0;font-family:inherit}
.acts button:hover{color:var(--brand)}

.bubble-att{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.bubble-att .f{font-size:11.5px;border-radius:6px;padding:2px 8px;
  color:var(--fg3);background:var(--card2)}

/* 输入：浮起来，不要通栏灰带 */
.wr-bar{flex:none;padding:6px 24px 14px;background:transparent;border-top:0}
.wr-box{width:100%;max-width:740px;margin:0 auto;border-radius:24px;
  background:var(--card);border:1px solid var(--line2);
  box-shadow:0 2px 6px rgb(0 0 0 / .05),0 12px 32px rgb(0 0 0 / .07);
  transition:border-color .15s,box-shadow .15s}
.wr-box:focus-within{border-color:color-mix(in srgb,var(--brand) 45%,var(--line2));
  box-shadow:0 2px 8px rgb(0 0 0 / .06),0 16px 40px rgb(0 0 0 / .09)}
.attach{display:flex;gap:6px;flex-wrap:wrap;padding:12px 16px 0}
.attach .a{font-size:12px;border-radius:99px;padding:3px 10px;
  color:var(--fg2);background:var(--card2);display:flex;gap:8px;align-items:center}
.attach .a b{cursor:pointer;color:var(--fg4);font-weight:400;line-height:1}
textarea#q{display:block;width:100%;border:0;background:transparent;color:var(--fg-prose);
  font:inherit;font-size:16px;line-height:1.7;resize:none;outline:none;
  padding:15px 18px 6px;min-height:56px;max-height:180px}

/* 工具栏：胶囊化，左右两组 */
.wr-ctl{display:flex;align-items:center;gap:8px;padding:4px 12px 10px;justify-content:space-between}
.wr-ctl .grp{display:flex;align-items:center;gap:6px;min-width:0}
.tool-pill{font-size:13px;border-radius:99px;border:1px solid var(--line2);
  background:transparent;color:var(--fg3);padding:5px 12px;cursor:pointer;
  font-family:inherit;white-space:nowrap;line-height:1.4}
.tool-pill:hover{border-color:color-mix(in srgb,var(--brand) 40%,var(--line2));color:var(--fg2)}
/* 开启态：棕色淡底 + 棕字，不再"像被禁用" */
.tool-pill[data-on="1"]{background:color-mix(in srgb,var(--brand) 13%,var(--card));
  border-color:color-mix(in srgb,var(--brand) 38%,var(--line2));color:var(--brand);font-weight:500}
.tool-pill:disabled{opacity:.4;cursor:not-allowed}
select.tool-pill{appearance:none;padding-right:26px;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),
    linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 15px) calc(50% - 1px),calc(100% - 11px) calc(50% - 1px);
  background-size:4px 4px;background-repeat:no-repeat}
#addBtn{width:30px;height:30px;padding:0;font-size:16px;line-height:1;border-radius:50%}
#model{max-width:150px;font-size:12.5px}
#send{width:34px;height:34px;padding:0;border-radius:50%;border:0;background:var(--brand);
  color:var(--brand-ink);font-size:16px;line-height:1;cursor:pointer;
  display:grid;place-items:center;flex:none}
#send:disabled{opacity:.35;cursor:not-allowed}
#stop{display:none}
#stop[data-on="1"]{display:inline-block;color:var(--err);
  border-color:color-mix(in srgb,var(--err) 40%,var(--line2))}
/* 状态与设置收进工具栏 */
#dot{width:6px;height:6px;border-radius:50%;background:var(--fg4);flex:none}
#dot[data-ok="1"]{background:var(--ok)}
#stat{font-size:11.5px;color:var(--fg4);white-space:nowrap}

.wr-hint{max-width:740px;margin:8px auto 0;font-size:11.5px;color:var(--fg4);text-align:center}
.wr-hint span+span::before{content:'·';margin:0 7px;opacity:.5}

/* 设置：浮层 */
.cfgbox{position:absolute;top:12px;right:24px;z-index:20;width:min(420px,calc(100% - 48px));
  border:1px solid var(--line2);border-radius:14px;background:var(--card);
  box-shadow:0 10px 34px rgb(0 0 0 / .18);padding:15px 17px;font-size:13px}
.cfgbox[hidden]{display:none}
.cfgbox label{display:block;color:var(--fg3);margin-bottom:6px;font-size:12.5px}
.cfgbox input{width:100%;border:1px solid var(--line2);border-radius:9px;padding:8px 11px;
  background:var(--bg);color:var(--fg);font:inherit;font-size:13px}
.cfgbox .note{color:var(--fg4);font-size:11.5px;line-height:1.7;margin-top:10px}
.cfgbox .row{display:flex;gap:8px;margin-top:11px;align-items:center}
</style>
</head>
<body>
<div class="wrap"><nav id="nav"></nav></div>

<div class="wr-main">
  <div class="cfgbox" id="cfg" hidden>
    <label for="key">API Key</label>
    <input id="key" type="password" placeholder="sk-...（留空用服务端的）" autocomplete="off">
    <div class="note">
      存在本机（<code>settings.js</code>），请求时随 <code>x-agent-key</code> 头发给本站代理，
      <b>只在内存里转发，不落盘、不记日志</b>。
    </div>
    <div class="row">
      <button class="tool-pill" id="keySave" data-on="1">保存</button>
      <button class="tool-pill" id="cfgClose">关闭</button>
    </div>
  </div>

  <div class="wr-empty" id="empty">
    <div class="mark">P</div>
    <h1>用一句话<em>写一张谱</em></h1>
    <p>拖入 MP3，然后告诉它你想要什么。它会调用命令去写，每一步改动都等你点头。</p>
    <p class="exp"><b>实验性</b> · 这条链路还在改：产出能导入 Phira 实测，但编排质量不稳定，
      同一段音频两次的结果可能差很远。别拿它当成品谱，先当草稿。</p>
  </div>

  <div class="wr-log" id="log" hidden></div>
</div>

<div class="wr-bar">
  <div class="wr-box">
    <div class="attach" id="attach" hidden></div>
    <textarea id="q" rows="1" placeholder="描述你想要的谱面…"></textarea>
    <div class="wr-ctl">
      <div class="grp">
        <button class="tool-pill" id="addBtn" title="加音频或图片">+</button>
        <input type="file" id="file" accept="audio/*,image/*" multiple hidden>
        <button class="tool-pill" id="thinkBtn" data-on="0">思考</button>
        <select class="tool-pill" id="effort" hidden>
          <option value="low">轻</option>
          <option value="medium" selected>标准</option>
          <option value="high">深</option>
        </select>
      </div>
      <div class="grp">
        <span id="dot"></span>
        <span id="stat">检查中…</span>
        <button class="tool-pill" id="cfgBtn">设置</button>
        <select class="tool-pill" id="model">
          <option value="deepseek-flash">deepseek-flash</option>
          <option value="deepseek-v4-pro">deepseek-v4-pro</option>
        </select>
        <button id="send" title="发送（Enter）">↑</button>
        <button class="tool-pill" id="stop" data-on="0">停止</button>
      </div>
    </div>
  </div>
  <div class="wr-hint">
    <span>Enter 发送</span><span>Shift+Enter 换行</span><span id="hintAudio">还没音频</span><span id="hintState" hidden></span>
  </div>
</div>

<script type="module" src="/js/write-page.js?v=V0.22.4.0"></script>
</body>
</html>
