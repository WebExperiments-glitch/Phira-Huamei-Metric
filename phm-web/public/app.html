<style>
/* 主题令牌（:root）全部来自 /css/base.css —— 这里不再重复定义，
   否则拆成多页后会有四五份 :root 各自漂移。 */
.apphead{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;margin-bottom:14px}
.apphead .slogan{font-size:13px;color:var(--fg2);flex:1;min-width:200px}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font:14px/1.6 "Segoe UI",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;padding:20px}
.wrap{max-width:880px;margin:0 auto}
header{display:flex;align-items:baseline;gap:12px;padding:6px 0 14px;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
header h1{font-size:20px;letter-spacing:.5px}
header h1 b{color:var(--amber)}
.ver{font-size:12px;color:var(--fg3)}
.slogan{font-size:12px;color:var(--fg2);width:100%}
.slogan b{color:var(--fg)}
.gh{display:inline-flex;align-items:center;gap:6px;font-size:12px;
color:var(--fg2);text-decoration:none;border:1px solid var(--line);border-radius:8px;
padding:5px 11px;transition:.15s;white-space:nowrap;
background:var(--card2);font:inherit;cursor:pointer;line-height:1.5}
.gh:hover{color:var(--fg);border-color:var(--fg3);background:var(--card)}
.gh:active{transform:translateY(1px)}
/* 顶部常驻搜索（不藏在任何面板里） */
.hsearch{margin-left:auto;display:flex;gap:7px;align-items:center}
.hsearch input{width:185px;background:var(--bg);border:1px solid var(--line);
border-radius:8px;padding:6px 11px;color:var(--fg);font:inherit;font-size:12px;outline:none}
.hsearch input:focus{border-color:var(--blue)}
.hsearch input::placeholder{color:var(--fg3)}
.hsearch button{border:1px solid var(--line);background:var(--card2);color:var(--fg2);
border-radius:8px;padding:6px 14px;font:inherit;font-size:12px;font-weight:600;
cursor:pointer;white-space:nowrap}
.hsearch button:hover{border-color:var(--blue);color:var(--fg)}
.hsearch button:disabled{opacity:.5;cursor:default}
/* 搜索结果区（页面级，独立于面板） */
.coutbox{margin:0 0 14px;padding:12px 15px;border:1px solid var(--line);
border-radius:12px;background:var(--card)}
.coutbox:empty{display:none;margin:0;padding:0;border:0}
/* 页面级状态条（算定数/导入的进度与错误都显示在这里，不再写进隐藏面板） */
.csstatus{margin:0 0 14px;padding:10px 14px;border-radius:10px;font-size:12px;line-height:1.7;
border-left:3px solid var(--fg3);background:var(--card);color:var(--fg2)}
.csstatus b{color:var(--fg)}
.csstatus.warn{border-left-color:var(--amber)}
.csstatus.err{border-left-color:var(--red)}
.csstatus.ok{border-left-color:var(--green)}
.csstatus a{color:var(--blue);text-decoration:none;border-bottom:1px dotted var(--blue);font-weight:700}
.cdl{display:inline-flex;align-items:center;gap:4px;text-decoration:none;
border:1px solid var(--amber);color:var(--amber);background:var(--card);
border-radius:6px;padding:2px 10px;font-size:11px;font-weight:700;white-space:nowrap}
.cdl:hover{background:rgba(232,163,61,.12)}
.gh svg{display:block;flex:none}
.gh button,.gh{cursor:pointer}
/* ── 连接 Phira 面板 ── */
.pf{margin:0 0 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);padding:14px 16px}
.pf .pfhead{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}
.pf .pfx{margin-left:auto;cursor:pointer;color:var(--fg3);padding:0 4px}
.pf .pfx:hover{color:var(--fg)}
.pf .pfdesc{font-size:12px;color:var(--fg2);margin:6px 0 10px;line-height:1.6}
.pf .pfdesc b{color:var(--fg)}
.pf .pfrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pf input{flex:1;max-width:280px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 11px;color:var(--fg);font:inherit;outline:none}
.pf input:focus{border-color:var(--blue)}
.pf button{border:0;border-radius:8px;padding:8px 18px;font:inherit;font-weight:700;cursor:pointer;background:var(--blue);color:#fff}
.pf button:disabled{opacity:.5;cursor:default}
.pf .pfmsg{font-size:12px;color:var(--fg2);margin-top:8px;min-height:1em}
.pfuser{display:flex;align-items:center;gap:13px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);flex-wrap:wrap}
.pfuser img{width:48px;height:48px;border-radius:50%;object-fit:cover;background:var(--card2)}
.pfuser .nm{font-weight:700;font-size:16px}
.pfuser .meta{font-size:12px;color:var(--fg2)}
.pfuser .rks{margin-left:auto;text-align:right}
.pfuser .rks b{font-size:23px;color:var(--amber)}
.pfuser .rks span{font-size:11px;color:var(--fg3);display:block}
.btable{margin-top:10px;width:100%;border-collapse:collapse;font-size:12.5px}
.btable th{text-align:left;color:var(--fg3);font-weight:400;padding:5px 6px;border-bottom:1px solid var(--line)}
.btable td{padding:5px 6px;border-bottom:1px solid var(--line)}
.btable tr:hover td{background:var(--card2)}
.btable .idx{color:var(--fg3);width:26px}
.btable .rk{color:var(--amber);font-variant-numeric:tabular-nums}
.btable .oc{color:var(--fg2);font-variant-numeric:tabular-nums}
.improw{margin-top:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.improw .hint{font-size:11.5px;color:var(--fg3)}
.pfnb{margin-top:11px;padding:9px 12px;border-radius:9px;background:var(--card2);
border-left:3px solid var(--amber);font-size:12px;color:var(--fg2);line-height:1.65}
.pfnb b{color:var(--fg)}
.pfchk{margin:7px 0 0;display:flex;flex-direction:column;gap:4px}
.pfchk>div{font-size:11.5px;color:var(--fg2)}
.pfchk>div b{color:var(--fg)}
.pfchk-tip{margin-top:8px;padding-top:7px;border-top:1px dashed var(--line);font-size:11.5px;color:var(--fg3)}
/* P.H.M. RKS 卡片 */
.pmrks{margin-top:11px;border:1px solid var(--line);border-radius:11px;
background:linear-gradient(180deg,var(--card2),var(--card));padding:12px 14px}
.pmhead{display:flex;align-items:baseline;gap:9px;font-weight:700;font-size:13px;flex-wrap:wrap}
.pmhead b{font-size:26px;color:var(--amber);font-variant-numeric:tabular-nums}
.pmtag{font-size:11px;color:var(--fg3);font-weight:400;border:1px solid var(--line);
border-radius:999px;padding:1px 8px}
.pmdesc{font-size:11.5px;color:var(--fg2);margin:7px 0 9px;line-height:1.7}
.pmdesc b{color:var(--fg)}
.pmrows{display:flex;flex-direction:column;gap:3px}
.pmrows>div{display:flex;gap:9px;align-items:baseline;font-size:11.5px;color:var(--fg2)}
.pmrows .i{color:var(--fg3);width:14px;flex:none}
.pmrows .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--fg)}
.pmrows .a,.pmrows .l,.pmrows .s{font-variant-numeric:tabular-nums;flex:none}
.pmrows .s{color:var(--amber);width:42px;text-align:right}
.pmrows .more{color:var(--fg3);font-size:11px}
.pmwarn{margin:0 0 9px;padding:8px 11px;border-radius:8px;background:rgba(232,163,61,.1);
border-left:3px solid var(--amber);font-size:11.5px;color:var(--fg2);line-height:1.65}
.pmwarn b{color:var(--amber)}
.pmnote{margin-top:9px;padding-top:8px;border-top:1px dashed var(--line);
font-size:11px;color:var(--fg3);line-height:1.6}
/* 表格里的 P.H.M. 定数列 */
.btable th.pmh{color:var(--amber);font-weight:400}
.btable .pm b{color:var(--amber);font-variant-numeric:tabular-nums}
.calcb{border:1px solid var(--line);background:var(--card2);color:var(--fg2);
border-radius:6px;padding:2px 10px;font:inherit;font-size:11px;cursor:pointer;line-height:1.6}
/* 提高优先级，避免被 .pf button 的主按钮样式覆盖成蓝色方块 */
.pf .calcb{border:1px solid var(--line);background:var(--card2);color:var(--fg2);
border-radius:6px;padding:2px 10px;font:inherit;font-size:11px;cursor:pointer;line-height:1.6}
.pf .calcb:hover{border-color:var(--amber);color:var(--amber);background:var(--card)}
.calcb:hover{border-color:var(--amber);color:var(--amber)}
.calcb:disabled{opacity:.5;cursor:default}
.pmhint{margin-top:8px;font-size:11px;color:var(--fg3);line-height:1.6}
.pmhint b{color:var(--fg2)}
/* 谱面搜索 */
/* 搜索结果列表 */
/* 不用 space-between —— 宽屏时提示会被推到最右边，和「找到 N 张」拉得老远，读起来断成两截 */
.cshead{font-size:11.5px;color:var(--fg3);margin:10px 0 5px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.cshead b{color:var(--fg)}
.cslist{display:flex;flex-direction:column;gap:1px}
.csrow{display:flex;gap:8px;align-items:center;font-size:11.5px;padding:4px 6px;border-radius:6px}
.csrow:hover{background:var(--card2)}
.csid{color:var(--fg3);font-variant-numeric:tabular-nums;flex:none;width:56px}
.csname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--fg)}
.cslv{color:var(--fg2);flex:none;width:74px;font-size:11px}
.csdif{color:var(--fg2);flex:none;width:36px;text-align:right;font-variant-numeric:tabular-nums}
.csflag{flex:none;width:42px;color:var(--fg3);font-size:10.5px}
.csflag i.ok{color:var(--green);font-style:normal}
/* 定数 + 按钮列。宽度要放得下最宽的一种组合（「15.40」+ 📤），
   否则加了分享按钮会把整行挤变形。右对齐让各行的数字纵向对齐。 */
.cspm{flex:none;width:112px;text-align:right}
.cspm b{color:var(--amber);font-variant-numeric:tabular-nums}
/* 分享按钮（搜索结果行内） */
.shbtn{border:1px solid var(--line);background:var(--card2);color:var(--fg2);
border-radius:6px;padding:1px 7px;font:inherit;font-size:12px;cursor:pointer;line-height:1.6}
.shbtn:hover{border-color:var(--amber);color:var(--amber)}
/* 分享按钮行（本机解析的结果卡片里） */
.srow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:14px;
padding-top:12px;border-top:1px dashed var(--line)}
.slabel{font-size:11.5px;color:var(--fg3);margin-right:2px}
.sbtn{border:1px solid var(--line);background:var(--card2);color:var(--fg2);border-radius:8px;
padding:6px 12px;font:inherit;font-size:12.5px;cursor:pointer;transition:.15s}
.sbtn:hover{border-color:var(--amber);color:var(--amber);background:var(--card)}
.sbtn:disabled{opacity:.45;cursor:default}
/* 不确定度提示：当 20 张参照官谱的定数跨度 ≥3 时出现。
   目的不是免责，是把「这个数有多硬」如实说出来。 */
.dualscale{margin-top:8px;padding:8px 12px;border-radius:8px;
  background:var(--panel2,rgba(127,127,127,.08));font-size:12.5px;
  display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.dualscale .dsl{color:var(--dim);font-size:11.5px;letter-spacing:.04em}
.dualscale b{font-size:15px}
.dualscale .dsh{color:var(--dim);font-size:11.5px}
.vague{margin-top:10px;padding:9px 12px;border-left:3px solid var(--amber);
background:var(--card2);border-radius:0 8px 8px 0;font-size:12px;color:var(--fg2);line-height:1.7}
.vague b{color:var(--amber)}
/* 下载按钮（搜索结果 / Phira 表共用）：网页端无法直读 Phira CDN，只能下载后拖入 */
.dlbtn{border:1px solid var(--line);background:var(--card2);color:var(--fg2);
border-radius:6px;padding:1px 9px;font:inherit;font-size:12px;cursor:pointer;line-height:1.6}
.dlbtn:hover{border-color:var(--blue);color:var(--fg);background:var(--card)}
/* 「算」主按钮：由服务端下载并计算 —— 搜索页的主路径 */
.cspm{display:inline-flex;gap:5px;align-items:center;justify-content:flex-end}
.calcbtn{border:1px solid var(--amber);background:transparent;color:var(--amber);
border-radius:6px;padding:1px 10px;font:inherit;font-size:12px;font-weight:700;
cursor:pointer;line-height:1.6;white-space:nowrap}
.calcbtn:hover{background:rgba(232,163,61,.13)}
.calcbtn:disabled{opacity:.45;cursor:default}
.csfoot{margin-top:9px;padding-top:8px;border-top:1px dashed var(--line);
font-size:11.5px;color:var(--fg3);line-height:1.6}
.csfoot b{color:var(--fg2)}
#drop{border:2px dashed var(--line);border-radius:16px;padding:46px 22px;text-align:center;
color:var(--fg2);cursor:pointer;transition:.15s;background:var(--card);margin-top:6px}
#drop:hover{border-color:var(--blue);background:var(--card2)}
#drop.hover{border-color:var(--amber);color:var(--fg);background:var(--card2)}
#drop .big{font-size:19px;font-weight:700;color:var(--fg);margin-bottom:7px}
/* 「谱面包是什么」——新用户最容易卡在这（不知道文件从哪来） */
#drop .what{font-size:11.5px;color:var(--fg3);margin-top:12px;line-height:1.7;
max-width:440px;margin-left:auto;margin-right:auto}
#drop .what b{color:var(--fg2)}
#drop .what code{background:var(--card2);border-radius:4px;padding:1px 4px;font-size:11px}
#drop input{display:none}
/* 第二层入口：进阶功能不抢第一屏，但要能一眼发现 */
.morebar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;
margin:16px 0 0;padding-top:14px;border-top:1px dashed var(--line)}
.morebar .mhint{font-size:11.5px;color:var(--fg3);margin-right:4px}
.note{font-size:11.5px;color:var(--fg3);margin:10px 2px 0}
.punch{margin-top:10px;border:1px dashed var(--line);border-radius:10px;padding:10px 12px;background:var(--card2)}
.punch .ptitle{font-weight:700;font-size:13px;color:var(--fg)}
.punch .pdesc{font-size:12px;color:var(--fg2);margin:4px 0 8px}
.punch .pdesc b{color:var(--fg)}
.punch .prow{display:flex;gap:8px;align-items:center}
.punch input{width:150px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;color:var(--fg);font:inherit;outline:none}
.punch input:focus{border-color:var(--blue)}
.punch button{border:0;border-radius:8px;padding:7px 18px;font:inherit;font-weight:700;cursor:pointer;background:var(--blue);color:#fff}
.punch button:disabled{opacity:.5;cursor:default}
.punch .popt{display:flex;gap:7px;align-items:flex-start;font-size:12px;color:var(--fg2);margin-top:9px;cursor:pointer;user-select:none;line-height:1.45}
.punch .popt input{width:auto;margin:2px 0 0;padding:0;accent-color:var(--blue);cursor:pointer}
.punch .popt b{color:var(--fg)}
.punch.off .prow{opacity:.9}   /* 勾选状态只影响「是否上传」，不影响本机算 RKS */
.punch .pmsg{font-size:12px;color:var(--fg2);margin-top:6px;min-height:1em}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:14px}
.card h2{font-size:15px;margin-bottom:2px}

.err{border-color:var(--red)}

.ps .u{font-size:13px;color:var(--fg3)}
.scale{position:relative;height:8px;border-radius:4px;background:var(--card2);margin:14px 0 4px;overflow:hidden}
.scale i{position:absolute;top:0;bottom:0;border-radius:4px;background:linear-gradient(90deg,var(--info),var(--brand),var(--err))}
.tick{position:relative;height:16px;font-size:10.5px;color:var(--fg3)}
.tick span{position:absolute;transform:translateX(-50%)}

.gcoord i{background:var(--coord)}.gstamina i{background:var(--stamina)}

td,th{padding:4px 6px;border-bottom:1px solid var(--line);text-align:left}

th{color:var(--fg3);font-weight:500;font-size:11.5px}
.why{margin-top:10px;font-size:12px;color:var(--fg2)}

.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}

<!-- ═════════ 引擎（纯函数，无 UI 依赖） ═════════ -->
<!-- ⚠ 早期曾与几个 Python 原型（phm_standard.py / enhance_features_v3.py / dims14.py）
     逐条对照过，但那些文件**不在本仓库里**，不要去找。唯一真源是 /js/engine.js。 -->
<!-- ═══ 引擎（浏览器与 Node 服务端共用同一份真源）═══
     见 public/js/engine.js 顶部注释：它同时被服务端 import 用于复核提交的定数，
     所以必须保持纯计算（不碰 DOM / localStorage / 网络）。 -->
<script type="module" src="/js/engine.js"></script>

<!-- ═════════ UI ═════════ -->
<!-- UI 工具层已并入下方主 module（拆分作用域会导致跨脚本取不到函数） -->
<!-- ═════════ 数据飞轮：匿名打卡（CloudBase）═════════ -->
<!-- 云 SDK：固定版本 + SRI
     第三方脚本跑在同源页面里，拥有与应用代码完全相同的权限（DOM / localStorage /
     账号 session）。此前用的是 @dev 浮动标签 —— CDN 上任何一次更新都会直接进入所有
     用户的浏览器，而账号 session 就存在 localStorage 里。
     现在钉死 0.1.3（npm latest）并加 integrity：内容对不上浏览器会拒绝执行。 -->
<script defer src="https://cdn.jsdelivr.net/npm/@tencent-ai/workbuddy-cloud-sdk@0.1.3/lib/index.global.js"
  integrity="sha384-z77MUA3IAqENYJOfGtmBKISLXkWlqVx8VWWQn9qxPwllJp6t43aKUFFMei2TYJWM"
  crossorigin="anonymous"></script>
<script type="module">
/* 共享界面工具层（导航 / 术语表 / i18n）。用**静态 import** —— 动态 import 会让
   同一模块拿到两个实例的风险，且本页需要 t() 在所有渲染点可用。 */
import { renderNav, glossaryHTML, applyStatic, t, onLangChange, currentLang } from '/js/ui.js';

/* ── 版本号：唯一来源是 <head> 里的 <meta name="app-version"> ──
   页头标签、页脚、PHM.status()、以及下面引擎的缓存版本串全从它取，只维护一处。
   ⚠ 注意区分两根轴：APP_VER 是本页面版本；engine_ver（"5d-knn-…"）是
   **算法**版本、会被写进数据行 —— 引擎没改动就不要动 engine_ver。 */
const APP_VER = (document.querySelector('meta[name="app-version"]') || {}).content || "—";

/* 共享导航（ui.js）。站点已经是多页了，四份手写的导航迟早对不上。 */
renderNav("app");
/* 术语表：反馈里最集中的一条是"官谱标度 / B19 / RKS / p99 像天书"。
   放在结果区上方而不是藏进「说明」里 —— 看不懂的人不会主动去找说明。 */
(function(){
  var g = document.getElementById("glossbox");
  if (g) g.innerHTML = glossaryHTML("a");
})();
/* 静态文案（data-i18n 系列）批量落地。JS 生成的文案各自在 onLangChange 里重绘。 */
applyStatic();

/* ── 引擎桥接 ──
   引擎以 ESM 提供（浏览器与 Node 共用）。用**动态 import + 版本查询串**加载：
   版本一变 URL 就变，天然破缓存 —— 于是「改版本号」和「让用户拿到新引擎」是同一件事，
   不必再手工维护一个容易忘记同步的 ?v=（服务端因此可以放心地长缓存 js）。
   加载后摊到全局，下面的代码照旧直接调用 zipParse / analyzeChart 等，无需改写。 */
const __ENGINE = await import("/js/engine.js?v=" + encodeURIComponent(APP_VER));
Object.assign(globalThis, __ENGINE);

/* ── 设置的真源 ──
   键名 / 默认值 / 读写只在 /js/settings.js 里定义一次。
   本页不再出现裸的 localStorage.getItem("phm_...") —— 下面那些
   OPTN / saveOptin / noticeAgreed 之类只是**薄包装**，保留它们是为了
   不动原有的调用点，内部一律委托给 settings.js。
   ⚠ 以后加设置项：改 settings.js，不要在页面里再写一个 key。 */
const __SET = await import("/js/settings.js");

/* 分享卡片模块（同样是版本化 URL，改版本号即破缓存）。
   抖音里链接点不了、X 上光发文字没人点 —— 能跨平台传播的只有图，
   所以「算完一张谱 → 导出体检卡」是传播链路里最关键的一环。 */
const { exportCard, fromChartRow, fromReport } = await import(
  "/js/sharecard.js");

/* ── 社区参照集（懒加载）──
   9,508 张 Phira 社区谱，约 730 KB（gzip 后约 200 KB）。**不随首屏加载** ——
   只有在真的要算一张谱时才拉，不拖慢「打开就走」这条主路径。
   为什么必须用它：官谱与社区谱不是同一个分布（社区谱 p50 15.1 / 官谱 10.6，
   长条占比只有官谱的 1/3）。留出验证：换参照集 + 8 维后 |偏差| 均值
   1.187 → 0.820，≤1.0 命中 67.0% → 84.2%。
   ⚠ 拉不到就退回官谱参照 —— 功能降级，但不报错、不阻塞。 */
let REF_COM = null, REF_COM_N = 0, REF_COM_STATE = "idle";
async function loadRefCom(){
  if (REF_COM_STATE === "ok" || REF_COM_STATE === "fail") return REF_COM;
  REF_COM_STATE = "loading";
  try{
    const r = await fetch("/data/ref-com.json?v=" + encodeURIComponent(APP_VER));
    if (!r.ok) throw new Error("HTTP " + r.status);
    const j = await r.json();
    if (!j || !Array.isArray(j.rows) || !j.rows.length) throw new Error("结构异常");
    REF_COM = j.rows; REF_COM_N = j.rows.length; REF_COM_STATE = "ok";
  }catch(e){
    REF_COM_STATE = "fail";
    console.warn("[phm] 社区参照集加载失败，退回官谱参照：" + (e.message || e));
  }
  return REF_COM;
}
/* 空闲时预热参照集：拖入的第一张谱不该等那 750 KB。
   放在 requestIdleCallback 里 —— 不抢首屏的带宽和主线程，
   失败了也无所谓（loadRefCom 自己会退回首屏官谱参照）。 */
if (typeof requestIdleCallback === 'function') {
  requestIdleCallback(function(){ loadRefCom(); }, { timeout: 6000 });
} else {
  setTimeout(function(){ loadRefCom(); }, 2500);
}

/* 参照集规模：**从数据里数，不在文案里写死** —— 写死过一次就会永远和实际不符。 */
const REF_N = () => REF_COM_N || (typeof REF_OFFICIAL !== "undefined" ? REF_OFFICIAL.length : 0);

/* ═══ UI 工具层 ═══
   并入本 module：原来它是独立的 <script>，与下面的主逻辑处于不同作用域，
   导致 handleFiles 里的 typeof contributeChart === "function" 恒为 false，
   贡献循环被静默跳过。合并后同一作用域，问题消失。 */
"use strict";
const $=function(s){return document.querySelector(s);};
const f1=function(v){return v==null?"-":(+v).toFixed(1);};
const f2=function(v){return v==null?"-":(+v).toFixed(2);};
const esc=function(st){return String(st).replace(/[&<>"]/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});
};
const GROUPS=[["density",function(){return t("app.res.g.density");}],
              ["pattern",function(){return t("app.res.g.pattern");}],
              ["coord",function(){return t("app.res.g.coord");}],
              ["stamina",function(){return t("app.res.g.stamina");}]];
/* 档位配色 —— ⚠ 与 js/ui.js 里的 TIER_COLOR 重复（已知债）。
   本页没走 ui.js 的模块作用域，暂时各留一份；两处数值必须一致。 */
const TIER_COLOR={"EZ":"var(--ok)","HD":"var(--info)","IN":"var(--brand)",
                  "AT":"var(--err)","SP":"var(--purple)"};
let STATE={reports:[],sel:0};

function card(r,idx){
  if(r.error) return '<div class="card err"><h2>✕ '+esc(r.label)
    +'</h2><div style="color:var(--red)">'+esc(r.error)+'</div></div>';
  const ps=r.ps, kn=r.knn||{ref:null,tier:"?",near:[]}, knOff=r.knnOff||null;
  const f=r.feats;
  const tier=kn.tier||"?";
  const tcol=TIER_COLOR[tier]||"var(--fg)";
  /* 不确定度：20 个参照谱的定数跨度。跨度越大，说明这张谱的结构
     在参照集里越没有紧密对应物，中点数字就越不该被当成结论。 */
  const span=(kn.hi!=null&&kn.lo!=null)?(kn.hi-kn.lo):null;
  const vague=span!=null&&span>=3.0;
  /* ── 双标度 ──
     同一个结构，在两份参照集上会给出两个数。它们不是"其中一个错了"，
     而是**两个不同的标度**：社区共识 = 站内谱师实际定价的共识；
     官谱标度 = 与 Phigros 官方一致的绝对标度。
     只印一个数，就是"IN 14 被算成 11.6"那类争议的根源 —— 单一数字看起来
     像个结论，实际上只是某个标度上的投影。两个都印，争议就变成了信息。 */
  const isCom = kn.basis === "community";
  const poolN = isCom ? REF_N() : (knOff && REF_OFFICIAL ? REF_OFFICIAL.length : 0);
  const basisName = isCom ? t("app.res.basis.com") : t("app.res.basis.off");
  const basisDesc = isCom ? t("app.res.desc.com") : t("app.res.desc.off");
  const gap = (isCom && knOff && knOff.ref != null && kn.ref != null)
    ? (kn.ref - knOff.ref) : null;
  const bars=GROUPS.map(function(g){
    return '<div class="g '+g[0]+'"><div class="t"><span>'+esc(g[1]())
      +'</span><b>'+f2(ps.g[g[0]])+'</b></div><div class="bar"><i style="width:'
      +(ps.g[g[0]]*100).toFixed(1)+'%"></i></div></div>';}).join("");
  const pos=function(v){return Math.max(0,Math.min(100,v/20*100));};
  const nearRows=(kn.near||[]).map(function(n2){
    return '<tr><td>'+esc(n2.name)+'</td><td>'+esc(n2.level)+'</td><td>'
      +f1(n2.diff)+'</td></tr>';}).join("");
  const rows=[
    [t("app.res.r.notes"),f.notes_real+(f.notes_all>f.notes_real
      ?t("app.res.r.notes.fake",{n:f.notes_all}):"")],
    [t("app.res.r.dur"),f1(f.duration_s)+" s"],[t("app.res.r.bpm"),f2(f.bpm)],
    [t("app.res.r.lines"),f.lines],
    [t("app.res.r.density"),f2(f.real_notes_per_second)+" /s"],
    [t("app.res.r.eff"),f2(f.eff_avg_tps_1s)+" / "+f2(f.eff_peak_tps_1s)],
    [t("app.res.r.strain"),f2(f.strain_p50)+" / "+f2(f.strain_p99)],
    [t("app.res.r.iv"),f2(f.iv_median)+" s"],
    [t("app.res.r.hold"),(f.hold_ratio*100).toFixed(1)+"%"],
    [t("app.res.r.stair"),f2(f.stair_speed_max)+" /s"],
    [t("app.res.r.cross"),f2(f.cross_hand_density)+" /s"],
    [t("app.res.r.multi"),t("app.res.r.multi.v",{n:f.multi_finger_3plus_events})],
    [t("app.res.r.charter"),r.charter||"-"],
  ];
  const uSpan = t("app.res.u",{ basis:basisName, desc:basisDesc, pool:poolN, n:(kn.n20)||0 })
    + (kn.lo!=null ? '　·　'+t("app.res.u.span",{ lo:f1(kn.lo), hi:f1(kn.hi) }) : '');
  const psline = t("app.res.psline",{ total:f1(ps.total), d:f2(ps.g.density),
    p:f2(ps.g.pattern), c:f2(ps.g.coord), s:f2(ps.g.stamina) });
  return '<div class="card">'
    +'<h2>'+esc(r.name)+'</h2>'
    +'<div class="sub">'+esc(r.sub||"")+'</div>'
    +'<div class="ps"><span class="tierbadge" style="background:'+tcol
    +'">'+esc(tier)+'</span>'
    +'<span class="num" style="color:'+tcol+'">'+f1(kn.ref)+'</span>'
    +'<span class="u">'+uSpan+'</span></div>'
    /* 官谱标度对照 —— 双标度里更"客观"的那一栏，同时也是可查证的锚点 */
    +(knOff&&knOff.ref!=null?'<div class="dualscale"><span class="dsl">'+esc(t("app.res.basis.off"))+'</span>'
      +'<b>'+f1(knOff.ref)+'</b>'
      +'<span class="dsh">'+esc(t("app.res.off.note",{n:(REF_OFFICIAL?REF_OFFICIAL.length:0)}))
      +(gap!=null?'　·　'+esc(gap>=0
          ? t("app.res.off.hi",{d:Math.abs(gap).toFixed(1)})
          : t("app.res.off.lo",{d:Math.abs(gap).toFixed(1)})) : '')
      +'</span></div>':'')
    +(vague?t("app.res.vague",{ n:(kn.n20)||0, lo:f1(kn.lo), hi:f1(kn.hi),
        span:span.toFixed(1), desc:basisDesc }):'')
    +'<div class="scale"><i style="left:0;width:'+pos(kn.ref).toFixed(1)
    +'%"></i></div>'
    +'<div class="tick"><span style="left:0">0</span>'
      +'<span style="left:50%">10</span><span style="left:100%">20</span></div>'
    +'<div class="srow"><span class="slabel">'+esc(t("app.res.share.label"))+'</span>'
      +'<button class="sbtn" type="button" data-share="wide" data-i="'+idx+'">'
      +esc(t("app.res.share.wide"))+'</button>'
      +'<button class="sbtn" type="button" data-share="tall" data-i="'+idx+'">'
      +esc(t("app.res.share.tall"))+'</button></div>'
    +'<table style="margin-top:8px"><tr><th>'+esc(t("app.res.near",{desc:basisDesc}))+'</th>'
    +'<th>'+esc(t("c.tier"))+'</th><th>'+esc(t("app.res.th.const"))+'</th></tr>'+nearRows+'</table>'
    +'<div class="psline">'+psline+'</div>'
    +'<div class="playstat" id="playstat-'+STATE.sel+'" style="display:none"></div>'
    +'<table>'+rows.map(function(x){return '<tr><td>'+esc(x[0])
      +'</td><td>'+esc(x[1])+'</td></tr>';}).join("")+'</table>'
    +'<div class="punch'+(OPTN()?"":" off")+'" id="punch-'+STATE.sel+'" data-i="'+STATE.sel+'">'
      +'<div class="ptitle">'+esc(t("app.res.punch.title"))
      +'<span style="font-weight:400;color:var(--fg3)">'+esc(t("app.res.punch.opt"))+'</span></div>'
      +'<div class="pdesc">'+t("app.res.punch.desc")+'</div>'
      +'<div class="prow"><input id="pacc" inputmode="decimal" autocomplete="off"'
      +' placeholder="'+esc(t("app.res.punch.ph"))+'" maxlength="9" value="'+esc(r._acc||"")+'">'
      +'<button id="pgo" type="button">'+esc(t("app.res.punch.go"))+'</button></div>'
      +'<label class="popt"><input type="checkbox" id="popt"'+(OPTN()?" checked":"")+'>'
      +'<span>'+t("app.res.punch.label")+'</span></label>'
      +'<div class="pmsg"></div></div>'
    +'</div>';
}
/* 上传偏好（默认开启；用户取消勾选后记住，不再上传） */
function OPTN(){ return typeof window.PHM_OPTIN==="undefined" ? true : window.PHM_OPTIN; }

function render(){
  const out=$("#out");
  if(!STATE.reports.length){out.innerHTML="";return;}
  let sel="";
  if(STATE.reports.length>1){
    sel='<div class="chips">'+STATE.reports.map(function(rp,i){
      return '<button class="chip'+(i===STATE.sel?' on':'')
        +'" data-i="'+i+'">'+esc(rp.label)+'</button>';}).join("")+'</div>';
  }
  out.innerHTML=sel+card(STATE.reports[STATE.sel],STATE.sel);
  const cur=STATE.reports[STATE.sel];
  if(typeof renderPlayStat==="function") renderPlayStat((cur&&cur.playStat)||null);
  const chips=out.querySelectorAll(".chip");
  chips.forEach(function(b2){b2.addEventListener("click",function(){
    /* 切换前把当前卡片的 ACC 输入存回 report，避免重建后丢失 */
    const curR=STATE.reports[STATE.sel];
    const curInp=document.getElementById("pacc");
    if(curR&&curInp) curR._acc=curInp.value;
    STATE.sel=+b2.getAttribute("data-i");render();});});
}

let LOAD_GEN=0;                        /* 代次：连续拖入时，后一批作废前一批的结果 */
const MAX_ZIP=60*1024*1024;            /* 单文件 60MB 上限（与下载路径一致，防打爆标签页） */
async function handleFiles(files){
  const gen=++LOAD_GEN;
  const msg=$("#msg"); msg.textContent=t("app.msg.parsing");
  const acc=[];
  for(const file of files){
    if(gen!==LOAD_GEN) return;         /* 已有更新的批次在跑，本次结果作废 */
    if(file.size>MAX_ZIP){
      acc.push({label:file.name,file:file.name,
        error:t("app.err.toobig",{mb:(file.size/1048576).toFixed(1),max:MAX_ZIP/1048576})});
      continue;
    }
    try{
      const buf=await file.arrayBuffer();
      const refCom=await loadRefCom();
      const rs=await analyzeChart(buf,file.name,{refCom:refCom});
      rs.forEach(function(r){r.label=file.name;acc.push(r);});
    }catch(e){
      acc.push({label:file.name,file:file.name,
        error:e.message||String(e)});
    }
  }
  if(gen!==LOAD_GEN) return;           /* 解析期间又拖了新文件 → 丢弃这批 */
  msg.textContent="";
  if(!acc.length){msg.textContent=t("app.err.none");return;}
  STATE.reports=acc;              /* 替换而非追加 —— 新谱面刷新视图 */
  STATE.sel=acc.length-1;         /* 聚焦最后拖入的 */
  render();
  /* 数据飞轮：后台查“这张谱别人打得怎么样”，回来就地补进卡片 */
  if(typeof loadPlayStats==="function"){
    acc.forEach(function(r){
      if(r.error||!r.name) return;
      loadPlayStats(r.name).then(function(s){
        r.playStat=s;
        if(STATE.reports[STATE.sel]===r&&typeof renderPlayStat==="function") renderPlayStat(s);
      }).catch(function(){});
    });
  }
  /* 顺带把结构定数贡献进共享缓存（谱面文件不上传，只写特征）
     ⚠ 必须在用户允许的范围内：关闭自动上传时一律不贡献。
     此前这段是无条件执行的，与「关闭后不再发出任何数据」的承诺直接矛盾。
     ⚠ 改为**串行 + 间隔**：多文件拖入时不会瞬间并发打满网关与数据库。 */
  if(OPTN() && typeof contributeChart==="function"){
    (async function(){
      for(const r of acc){
        if(r.error||!r.name) continue;
        if(!OPTN()) break;                       /* 中途关掉就立刻停 */
        try{
          const res=await contributeChart(r);
          /* 同名多难度、无法唯一确定 → 明确告知用户「没写」，而不是静默跳过 */
          if(res&&res.ambiguous){
            csMsg(t("app.contrib.ambiguous",{name:esc(r.name),
              n:(res.candidates||t("app.contrib.many"))}),"warn");
            continue;
          }
          if(res&&!res.skipped){
            r.contributed=res;
            csMsg(t("app.contrib.ok",{name:esc(res.name)}),"ok");
            if(typeof renderStats==="function") renderStats();
          }
        }catch(e){}
        await new Promise(function(s){ setTimeout(s,600); });
      }
    })();
  }
}

"use strict";
/* ═════ 全局健壮性：统一事件委托（最先绑定，不依赖后续任何代码）═════
   教训：绑定写在脚本末尾时，前面任意一句同步代码抛错都会让按钮彻底失灵。 */
window.addEventListener("error",function(ev){
  try{
    const el=document.getElementById("pfmsg")||document.getElementById("msg");
    if(el){ el.textContent=t("app.err.script",{e:((ev&&ev.message)||t("app.err.unknown"))});
      el.style.color="var(--red)"; }
  }catch(e){}
});
window.addEventListener("unhandledrejection",function(ev){
  try{
    const el=document.getElementById("pfmsg");
    if(el&&!el.textContent){
      const m=(ev&&ev.reason&&ev.reason.message)||t("app.err.netperm");
      el.textContent=t("app.err.async",{e:m}); el.style.color="var(--red)";
    }
  }catch(e){}
});
/* 统一 click 委托 */
document.addEventListener("click",async function(e){
  const el=e.target; if(!el||!el.closest) return;
  try{
    /* ── P.H.M. 账号 ── */
    if(el.closest("#authBtn")){
      const p=document.getElementById("authpanel");
      if(p){
        const show=(p.style.display==="none");
        p.style.display=show?"":"none";
      }
      return;
    }
    if(el.closest("#aclose")){ const p=document.getElementById("authpanel"); if(p) p.style.display="none"; return; }
    if(el.closest("#atab-login")){ authSetMode("login"); return; }
    if(el.closest("#atab-signup")){ authSetMode("signup"); return; }
    if(el.closest("#atab-reset")){ authSetMode("reset"); return; }
    if(el.closest("#asend")){ await authSend(); return; }
    if(el.closest("#asubmit")){ await authSubmit(); return; }
    if(el.closest("#abindgo")){ await authBind(); return; }
    if(el.closest("#aunbind")){ await authUnbind(); return; }
    if(el.closest("#asignout")){
      try{ await cloud.auth.signOut(); }catch(err){}
      AUTH.user=null; await authRender();
      csMsg(t("app.auth.signout.done"),"ok");
      return;
    }
    if(el.closest("#achpwBtn")){
      const f=document.getElementById("achpwForm");
      if(f) f.style.display=(f.style.display==="none"?"":"none");
      return;
    }
    if(el.closest("#achpwGo")){ await authChangePw(); return; }
    /* ── 设置面板 ── */
    if(el.closest("#setBtn")){
      const sp=document.getElementById("setPanel");
      if(sp) sp.style.display=(sp.style.display==="none"?"":"none");
      return;
    }
    /* ── 面板与功能 ── */
    if(el.closest("#cgo")){ await chartSearch(); return; }
    const calc=el.closest(".calcbtn");
    if(calc){
      await analyzeByChartId(+calc.getAttribute("data-cid"), calc);
      return;
    }
    const dl=el.closest(".dlbtn");
    if(dl){
      const url=dl.getAttribute("data-file");
      const nm=dl.getAttribute("data-name")||t("app.chart.anon");
      if(!url){ csMsg(t("app.dl.nofile"),"err"); return; }
      /* ⚠ 协议白名单：data-file 来自 Phira API，esc() 只防了属性注入，
         防不住 javascript: / data: 这类协议。不校验就等于把 <a href> 交给远端决定。 */
      if(!/^https?:\/\//i.test(url)){ csMsg(t("app.dl.badurl"),"err"); return; }
      const a=document.createElement("a");
      a.href=url; a.target="_blank"; a.rel="noopener noreferrer";
      document.body.appendChild(a); a.click(); a.remove();
      csMsg(t("app.dl.downloading",{name:esc(nm)}),"ok");
      return;
    }
    /* ── 导出分享图 ──
       抖音里链接点不了、X 上光发文字没人点 —— 能跨平台传播的只有图。
       卡上自带曲名 + 数字 + 域名，别人照着搜就能进来。 */
    const sh=el.closest(".shbtn");
    if(sh){
      const cid=+sh.getAttribute("data-scid");
      const mode=sh.getAttribute("data-mode")==="tall"?"tall":"wide";
      const row=(typeof CHART_CACHE!=="undefined"&&CHART_CACHE[cid])||null;
      if(!row||row.ref_const==null){ csMsg(t("app.sh.noconst"),"err"); return; }
      const raw=sh.textContent;
      sh.disabled=true; sh.textContent="…";
      try{
        const res=await exportCard(fromChartRow(row),mode,currentLang());
        if(res==="downloaded") csMsg(t("app.sh.saved",
          {mode:(mode==="tall"?t("app.sh.mode.tall"):t("app.sh.mode.wide"))}),"ok");
      }catch(e){ csMsg(t("app.sh.fail",{e:esc((e&&e.message)||t("app.err.unknown"))}),"err"); }
      sh.disabled=false; sh.textContent=raw;
      return;
    }
    const sb=el.closest(".sbtn");
    if(sb){
      const i=+sb.getAttribute("data-i");
      const mode=sb.getAttribute("data-share")==="tall"?"tall":"wide";
      const r=STATE.reports[i];
      if(!r||r.error){ csMsg(t("app.sh.unparsed"),"err"); return; }
      const raw=sb.textContent;
      sb.disabled=true; sb.textContent=t("app.sh.working");
      try{
        const res=await exportCard(fromReport(r),mode,currentLang());
        if(res==="downloaded") csMsg(t("app.sh.saved",
          {mode:(mode==="tall"?t("app.res.share.tall"):t("app.res.share.wide"))}),"ok");
      }catch(e){ csMsg(t("app.sh.fail",{e:esc((e&&e.message)||t("app.err.unknown"))}),"err"); }
      sb.disabled=false; sb.textContent=raw;
      return;
    }
    const cb=el.closest(".calcb");
    if(cb&&!el.closest(".cdl")){          /* .cdl 是下载链接，不能再当「算」处理 */
      const cid=+cb.getAttribute("data-cid");
      const fromSrch=(CS.rows||[]).filter(function(c){return c.id===cid;})[0];
      await computeChart(cid,cb,fromSrch||null);
      return;
    }
    const pb=el.closest("#pgo");
    if(pb){ const box=pb.closest(".punch");
      if(box) await submitPunch(+(box.getAttribute("data-i")||STATE.sel)); }
  }catch(err){
    try{ pfMsg(t("app.err.op",{e:(err&&err.message?err.message:t("app.err.unknown"))}),"var(--red)","err"); }catch(e2){}

/* 单曲 rks（Phigros/Phira 社区公式）：((acc−55)/45)²×定数，acc<70 记 0 */
function songRks(cst,accPct){
  if(!(cst>0)||!(accPct>=70)) return 0;
  const k=(accPct-55)/45;
  return k*k*cst;
}
/* 容错解析：96.5→96.5；0.965→96.5；965000（万分制分数）→96.5 */
function parseAcc(s){
  s=String(s).trim().replace(/%\s*$/,"").replace(/[,，]/g,"");
  if(!/^\d{1,6}(\.\d+)?$/.test(s)) return null;
  let v=+s;
  if(v>0&&v<1) v=v*100;          /* 0.965 小数形式 → 96.5 */
  if(v>1000) v=v/10000;          /* 万分制分数 → ACC */
  if(v>100) return null;
  return v>0?v:null;
}

/* ═════════ Phira 连接：公开 API（无需密码，CORS 开放）═════════ */
const PHIRA_API="https://api.phira.cn";
/* 面板内消息。⚠ 面板收起时用户看不见 —— 自动转发到页面级状态条。
   kind 可由调用方显式给出（翻译后的文案不再靠中文关键词猜语气）。 */
function pfMsg(text,col,kind){
  const el=$("#pfmsg");
  if(el){ el.textContent=text||""; el.style.color=col||""; }
  if(!text) return;
  const panel=document.getElementById("ppanel");
  if(panel&&panel.style.display!=="none") return;      /* 面板开着，用户看得到 */

  if(kind==null){
    kind=/失败|错误|无法|不支持|异常|没搜到/.test(plain)?"err"
              :(/⚠/.test(plain)?"warn":"");
  }
  csMsg(esc(plain),kind);
}
/* Phira 公开 API 取数（只读）。
   ⚠ api.phira.cn 是第三方，偶尔超时/限流 —— 实测搜索会卡满 15s 后失败。
   所以这里带一次重试 + 退避：网络抖动时用户不必自己再点一次。
   注意重试只针对**可重试**的失败（超时、网络错误、5xx、429）；
   4xx（除了 429）说明请求本身有问题，重试没意义。 */
async function pfGet(p,retries){
  const max = retries == null ? 1 : retries;
  let lastErr = null;
  for (let attempt = 0; attempt <= max; attempt++) {
    if (attempt) await new Promise(function(s){ setTimeout(s, 600 * attempt); });
    try {
      const r = await fetchTO(PHIRA_API + p, 15000, { headers: { "Accept": "application/json" } });
      if (r.ok) return await r.json();
      lastErr = new Error("Phira API " + r.status);
      const retriable = r.status === 429 || r.status >= 500;
      if (!retriable) throw lastErr;
    } catch (e) {
      lastErr = (e instanceof Error) ? e : new Error(String(e));
      /* fetchTO 抛出的超时/网络错误也属于可重试 */
      if (/Phira API (4\d\d)/.test(lastErr.message) && !/429/.test(lastErr.message)) throw lastErr;
    }
  }
  throw lastErr || new Error(t("app.err.phira.api"));
}

/* 数值清洗：越界/非有限值一律置 null，避免触发数据库 CHECK 约束；dp 指定小数位 */
function numOrNull(v,min,max,dp){
  if(v==null||v==="") return null;
  let n=+v;
  if(!isFinite(n)) return null;
  if(min!=null&&n<min) return null;
  if(max!=null&&n>max) return null;
  if(dp!=null) n=+n.toFixed(dp);
  return n;
}
/* 文字清洗：去控制字符、限长 */
function txtOrNull(s,max){
  if(s==null) return null;
  const t=String(s).replace(/[\u0000-\u001f\u007f]/g,"").trim();
  return t?t.slice(0,max||120):null;
}

/* ═════ P.H.M. 谱面定数共享缓存 ═════
   谱面文件按需下载（CORS 开放），用本页引擎算参考定数后入云端，
   所有用户共享 —— 别人算过的谱你不用再下载。 */
const CHART_CACHE={};                  /* chart_id → {ref_const, ps_score, ...} */
async function loadChartCache(ids){
  /* 合并式加载 —— 绝不能清空：清空会把刚算好的定数一起抹掉（曾是这样，已修） */
  if(!cloudDB||!ids||!ids.length) return;
  try{
    const res=await cloudDB.from("phm_charts")
      .select("chart_id,ref_const,ps_score,nps,speed_peak,engine_ver")
      .in("chart_id",ids);
    if(res.error) return;
    (res.data||[]).forEach(function(x){ CHART_CACHE[x.chart_id]=x; });
  }catch(e){}
}
/* 缓存里的定数（有就返回 number，否则 null） */
function cachedConst(cid){
  const c=CHART_CACHE[cid];
  return (c&&c.ref_const!=null)?+c.ref_const:null;
}
/* 带超时的 fetch（网络挂起时不再无限等待） */
function fetchTO(url,ms,opts){
  const o=opts||{};
  const ctl=(typeof AbortController!=="undefined")?new AbortController():null;
  let rejectFn=null;
  const timer=setTimeout(function(){
    if(ctl){ try{ctl.abort();}catch(e){} }
    if(rejectFn) rejectFn(new Error(t("app.err.timeout",{s:Math.round((ms||15000)/1000)})));
  },ms||15000);
  return new Promise(function(resolve,reject){
    rejectFn=reject;
    fetch(url, ctl?Object.assign({},o,{signal:ctl.signal}):o)
      .then(function(r){ clearTimeout(timer); resolve(r); },
            function(e){ clearTimeout(timer); reject(e); });
  });
}

async function authSubmit(){

  const code=(document.getElementById("acode").value||"").trim();
  const btn=document.getElementById("asubmit");
  if(!email){ aMsg(t("app.auth.need.email"),"err"); return; }
  btn.disabled=true; aMsg(t("app.auth.working"));
  try{
    if(AUTH.mode==="login"){
      const r=await cloud.auth.signInWithPassword({email:email,password:pw});
      if(r.error){ aMsg(t("app.auth.login.fail"),"err"); btn.disabled=false; return; }
      await authAfterSignIn(r.data&&r.data.user);
    }else if(AUTH.mode==="signup"){
      const p=AUTH.pending;
      if(!p||p.email!==email){ aMsg(t("app.auth.need.send"),"err"); btn.disabled=false; return; }
      if(!code){ aMsg(t("app.auth.need.code"),"err"); btn.disabled=false; return; }
      const _w=pwWarn(pw); if(_w){ aMsg(_w,"err"); btn.disabled=false; return; }
      const r=await cloud.auth.verifyOtp({
        email:p.email, verificationId:p.verificationId,
        isExistingUser:p.isExistingUser, token:code,
        password:p.isExistingUser?undefined:pw
      });
      if(r.error){ aMsg(t("app.auth.verify.fail",{e:(r.error.message||t("app.auth.code.wrong"))}),"err"); btn.disabled=false; return; }
      AUTH.pending=null;
      await authAfterSignIn(r.data&&r.data.user);
      if(p.isExistingUser) aMsg(t("app.auth.existing"),"ok");
    }else{
      if(!AUTH.resetChallenge){
        const st=await cloud.auth.resetPasswordForEmail(email);
        if(st.error){ aMsg(t("app.auth.send.fail",{e:(st.error.message||t("app.auth.err.retry"))}),"err"); btn.disabled=false; return; }
        AUTH.resetChallenge=st.data;
        document.getElementById("acodeWrap").style.display="";
        aMsg(t("app.auth.reset.sent"),"ok");
        btn.disabled=false; return;
      }
      if(!code){ aMsg(t("app.auth.reset.needcode"),"err"); btn.disabled=false; return; }
      const _w=pwWarn(pw); if(_w){ aMsg(_w,"err"); btn.disabled=false; return; }
      const done=await AUTH.resetChallenge.updateUser({nonce:code,password:pw});
      if(done.error){ aMsg(t("app.auth.reset.fail",{e:(done.error.message||t("app.auth.code.wrong2"))}),"err"); btn.disabled=false; return; }
      AUTH.resetChallenge=null;
      await authAfterSignIn(done.data&&done.data.user);
      aMsg(t("app.auth.reset.done"),"ok");
    }
  }catch(e){ aMsg(t("app.auth.fail",{e:(e&&e.message||t("app.err.net"))}),"err"); btn.disabled=false; }
}

/* ── 拖入谱面 → 匹配 Phira chart_id → 把结构定数写进共享缓存 ──
   这是「全站共享定数池」真正能转起来的路径：
   CORS 挡住了后台直读，但用户主动拖入的文件完全合法可用；
   写进去的只有谱面结构特征，谱面文件本身不会上传。 */
async function contributeChart(rep){
  if(!OPTN()) return null;                       /* 第二道防线：关闭时绝不贡献 */
  /* ⚠ 第三道防线（2026-10-07 补）：首次贡献前必须**明确告知过**。
     在这之前 ensureNotice() 只被 pfSearch 调用，而那条路径早已不可达 ——
     于是「首次上传前会弹一次告知」这句承诺其实从未兑现：开关默认开着，
     用户拖一张谱就静默上传了。文案与行为不一致，必须按行为修。 */
  if(!ensureNotice()) return null;
  if(!cloudDB||!rep||rep.error||!rep.name) return null;
  const rc=rep.knn&&rep.knn.ref;
  if(rc==null) return null;
  try{
    const r=await pfGet("/chart?search="+encodeURIComponent(rep.name)+"&pageNum=15&page=1");
    const list=Array.isArray(r)?r:(r.results||[]);
    /* ⚠ 同名多难度消歧：同曲的 EZ/HD/IN/AT 名字完全一样，
       只按名字取第一个会把 IN 的特征写到 HD 的 chart_id 上。
       用 pickUniqueChart 逐级消歧，无法唯一确定就放弃（宁可不写，不可写错）。 */
    const pick=pickUniqueChart(list,{
      name:rep.name,
      tier:rep.knn?rep.knn.tier:null,
      levelTxt:rep.level||null
    });
    if(!pick.hit){
      return {ambiguous:(pick.reason==="ambiguous"),reason:pick.reason,candidates:pick.candidates||0};
    }
    const hit=pick.hit;
    if(!hit.id) return null;
    if(cachedConst(hit.id)!=null) return {id:hit.id,name:hit.name,skipped:true};
    const f=rep.feats||{};
    const payload={
      chart_id:numOrNull(hit.id,1,null),
      name:txtOrNull(hit.name,160),
      level:txtOrNull(hit.level||rep.level,60),
      difficulty:numOrNull(hit.difficulty,0,25,3),
      ref_const:numOrNull(rc,0,25,4),
      ps_score:numOrNull(rep.ps&&rep.ps.total,0,25,4),
      nps:numOrNull(f.real_notes_per_second,0,200,4),
      hold_ratio:numOrNull(f.hold_ratio,0,1,5),
      notes:numOrNull(f.notes_real,0,100000),
      stair_avg:numOrNull(f.stair_speed_avg,0,500,4),
      speed_peak:numOrNull(rep.spPeak,0,1000000),
      engine_ver:ENGINE_VER
    };
    if(payload.chart_id==null) return null;
    const up=await apiWrite("/api/contribute",[payload]);   /* 走服务端网关（含复核） */
    /* 服务端有三种结果：written=本次新写入 / skipped=已有权威值（无需重复）/ failed=复核或写入失败 */
    if(!up) return null;
    if(up.written>0){
      /* 服务端复算值与本地不一致 → 说明本页引擎版本旧了 */
      if(up.mismatched) return {id:hit.id,name:hit.name,stale:true};
      return {id:hit.id,name:hit.name};
    }
    if(up.skipped>0) return {id:hit.id,name:hit.name,skipped:true};
    return null;
    CHART_CACHE[hit.id]=payload;
    return {id:hit.id,name:hit.name};
  }catch(e){ return null; }
}

/* 服务端写入网关（/api/*）：校验 + 限流 + 落库都在服务端做。
 * ⚠ 失败就是失败，**不再回退直连数据库**。
   此前那段 fallback 有两个严重问题，属于自相矛盾的设计：
   ① 它让客户端保留了一条**绕过网关的写库路径** —— 于是「服务端负责校验与
      限流」这句话不成立，网关不是边界；
   ② 服务端过载时：请求失败 → 客户端改打数据库 → 数据库更忙 → 更多失败 →
      更多客户端切换 fallback，形成自我放大的反馈风暴（越忙越打）。
   上传失败不影响本机结果：定数已经算好并显示在卡片上了。 */
async function apiWrite(path,rows){
  const r=await fetchTO(path,20000,{
    method:"POST",
    headers:{"content-type":"application/json"},
    body:JSON.stringify({rows:rows})
  });
  if(!r.ok){
    let msg="HTTP "+r.status;
    try{ const j=await r.json(); if(j&&(j.error||j.note)) msg=j.error||j.note; }catch(e){}
    throw new Error(msg);
  }
  const j=await r.json();
  if(j&&j.fail&&j.fail.length) throw new Error(String(j.fail[0]).slice(0,120));
  return j;
}

/* 按需下载一张谱面 → 本页引擎算定数 → 入云端缓存
   info 可显式传入（搜索结果），否则从 PF.rows 里找
   ⚠ Phira 的文件 CDN 未开放跨域 → 浏览器 fetch 必然失败，届时降级为「下载 + 拖入」 */
async function computeChart(cid,btn,info){
  if(!info){
    const row=(PF.rows||[]).filter(function(r){return r.chart===cid;})[0]||{};
    info=row.info||{};
  }
  const nm=info.name||t("app.chart.id",{id:cid});
  const url=info.file;
  if(!url){ csMsg(t("app.calc.nochartfile",{name:esc(nm)}),"err"); return; }
  btn.disabled=true; btn.textContent=t("app.calc.dling");
  csMsg(t("app.calc.dling2",{name:esc(nm)}));
  try{
    const res=await fetchTO(url,90000);
    if(!res.ok) throw new Error("HTTP "+res.status);
    /* 安全边界：拒绝异常大的包（防内存爆掉/恶意文件） */
    const len=+(res.headers.get("content-length")||0);
    const MAXB=60*1024*1024;
    if(len>MAXB){
      try{ if(res.body&&res.body.cancel) await res.body.cancel(); }catch(e){}
      throw new Error(t("app.calc.toobig",{mb:(len/1048576).toFixed(0),max:MAXB/1048576}));
    }
    const buf=await res.arrayBuffer();
    if(buf.byteLength>MAXB) throw new Error(t("app.calc.toobig2"));
    btn.textContent=t("app.msg.parsing");
    csMsg(t("app.calc.dled",{mb:(buf.byteLength/1048576).toFixed(2)}));
    /* ⚠ 这里必须传 excludeId=cid：这张谱就在社区参照集里，
       不排除就是与它自己匹配（距离 0），算出来的等于把 Phira 的标签抄一遍。 */
    const rs=await analyzeChart(buf,nm+".pez",{refCom:await loadRefCom(),excludeId:cid});
    const rep=rs.filter(function(x){return !x.error;})[0];
    if(!rep) throw new Error((rs[0]&&rs[0].error)||t("app.calc.parsefail"));
    const f=rep.feats||{};
    const payload={
      chart_id:numOrNull(cid,1,null),
      name:txtOrNull(info.name||rep.name,160),
      level:txtOrNull(info.level||rep.level,60),
      difficulty:numOrNull(info.difficulty,0,25,3),
      ref_const:numOrNull(rep.knn&&rep.knn.ref,0,25,4),
      ps_score:numOrNull(rep.ps&&rep.ps.total,0,25,4),
      nps:numOrNull(f.real_notes_per_second,0,200,4),
      hold_ratio:numOrNull(f.hold_ratio,0,1,5),
      notes:numOrNull(f.notes_real,0,100000),
      stair_avg:numOrNull(f.stair_speed_avg,0,500,4),
      speed_peak:numOrNull(rep.spPeak,0,1000000),
      engine_ver:ENGINE_VER
    };
    if(payload.chart_id==null) throw new Error(t("app.calc.badid"));
    try{
      const up=await apiWrite("/api/contribute",[payload]);
      if(!up||(!(up.written>0)&&!(up.skipped>0))) csMsg(t("app.calc.writefail"),"warn");
    }catch(ce){
      csMsg(t("app.calc.writefail2",{e:esc((ce&&ce.message)||t("app.err.net"))}),"warn");
    }
    CHART_CACHE[cid]=payload;
    const rc=payload.ref_const;
    csMsg(t("app.calc.done2",{name:esc(payload.name),
        rc:(rc!=null?rc.toFixed(2):"—")})
      +(rc!=null?esc(t("app.calc.apnote")):"")+esc(t("app.calc.stored")),"ok");
    if(typeof renderChartSearch==="function") renderChartSearch();
  }catch(err){
    btn.outerHTML='<a class="cdl" href="'+esc(url)+'" target="_blank" rel="noopener"'
      +' title="'+esc(t("app.dl.title"))+'">📥 '+esc(t("app.dl.short"))+'</a>';
    csMsg(t("app.calc.corsfail",{name:esc(nm),
      e:esc(err&&err.message?err.message:"fetch failed")}),"warn");
  }
}

/* ═════ 语言切换：静态文案 applyStatic 覆盖，JS 生成的必须自己重画 ═════
   本页几乎全是 JS 渲染（结果卡片、搜索列表、账号面板、统计条），
   只重画静态部分等于半翻译。 */
onLangChange(function(){
  applyStatic();
  fillVersion();
  render();              /* 结果卡片 + 难度 chips */
  renderChartSearch();   /* 谱面搜索结果列表 */
  authRender();          /* 账号面板 + 顶栏按钮 */
  renderStats();         /* 公开统计条 */
});
</script>
