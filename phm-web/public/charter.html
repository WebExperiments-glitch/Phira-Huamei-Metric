<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="app-version" content="V0.7.0">
<title>谱师作品 · P.H.M.</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d1117'/%3E%3Ctext x='16' y='23' font-size='19' font-family='sans-serif' font-weight='bold' text-anchor='middle' fill='%23e8a33d'%3EP%3C/text%3E%3C/svg%3E">
<meta name="description" content="查 Phira 谱师的全部作品：按档位分布、平均定数，以及对每张谱的 P.H.M. 结构定数参考。支持分页浏览。">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/css/base.css?v=V0.7.0">
<style>
.chhead{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.chhead .nm{font-size:21px;font-weight:500}
.chhead .mt{font-size:12.5px;color:var(--fg3)}
.sumgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(108px,1fr));gap:10px;margin:14px 0}
.sum{background:var(--card2);border-radius:10px;padding:10px 13px}
.sum .k{font-size:11.5px;color:var(--fg3)}
.sum .v{font-size:20px;font-variant-numeric:tabular-nums;margin-top:2px}
.sum .n{font-size:11px;color:var(--fg3)}

.dist{display:flex;height:24px;border-radius:7px;overflow:hidden;margin:12px 0 6px;background:var(--card2)}
.dist i{display:flex;align-items:center;justify-content:center;font-size:11px;color:#0d1117;font-weight:600}
.distlg{display:flex;gap:12px;font-size:11.5px;color:var(--fg3);flex-wrap:wrap}
.distlg span i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px}

.tier{display:inline-block;min-width:24px;text-align:center;padding:1px 5px;border-radius:5px;
  font-size:10.5px;font-weight:600;color:#0d1117}
.pm{font-variant-numeric:tabular-nums;color:var(--amber)}
.nopm{color:var(--fg3)}
.dgap{font-size:11px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0 10px}
.toolbar select.inp{padding:5px 8px;font-size:12.5px}

.prog{height:5px;border-radius:3px;background:var(--card2);overflow:hidden;margin:10px 0 6px}
.prog i{display:block;height:100%;background:var(--amber);width:0;transition:width .2s}

table.tbl{font-size:12.5px}
table.tbl td.nm{max-width:260px;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>
<div class="wrap">

<nav id="nav"></nav>

<div class="card">
  <h2>查谱师作品</h2>
  <div class="sub">输入谱师名，列出他/她在 Phira 上的作品与每张谱的 P.H.M. 定数。
  Phira 没有「按谱师查」的接口，所以本页是<b>翻搜索结果再按 charter 字段精确筛</b>。</div>
  <div class="row">
    <input class="inp" id="q" style="flex:1;min-width:180px" placeholder="谱师名（例如 6thPecJam / YanY / Magazet）" autocomplete="off">
    <button class="btn primary" id="go">扫描</button>
    <button class="btn" id="more" style="display:none">继续扫描 ›</button>
  </div>
  <div class="prog" id="prog" style="display:none"><i id="progbar"></i></div>
  <div class="status" id="msg"></div>
</div>

<div id="out"></div>

<div class="card" id="glossbox"></div>

<footer>
  <div>数据来源：<b>Phira 公开 API</b> + 本站共享定数缓存。</div>
  <div class="fd">Phira 的 <span class="mono">/chart?search=</span> 会<b>同时匹配曲名与谱师</b>，
  所以本页分两栏：「精确同名」是他的作品，「仅包含」是名字里带这个词的别的谱 —— 不混在一起。</div>
</footer>

</div>

<script type="module">
import { renderNav, esc, f1, f2, lvTag, tierColor, pagerHTML, wirePager,
         tierBadge, glossaryHTML, loadChartCache, cachedRow }
  from '/js/ui.js?v=V0.7.0';
import { scanCharter } from '/js/phira.js?v=V0.7.0';

renderNav('charter');
document.getElementById('glossbox').innerHTML = glossaryHTML('c');
const $ = s => document.querySelector(s);
const msg = (t, k) => { const e = $('#msg'); e.className = 'status' + (k ? ' ' + k : ''); e.innerHTML = t || ''; };

/* 页面状态：扫描结果 + 列表视图（分页/排序/过滤）。
   分开存的原因是——扫描很贵（要打好几次 Phira），
   不能因为用户换了个排序就重新扫一遍。 */
const SCAN = { name: '', exact: [], fuzzy: [], seen: [], count: 0, pages: 1, lastPage: 0, done: false };
const VIEW = { page: 1, pageSize: 25, sort: 'diff', filter: 'all' };
const SIZES = [20, 25, 50, 100];

const pre = new URLSearchParams(location.search).get('name');
if (pre) $('#q').value = pre;

$('#go').addEventListener('click', () => start(true));
$('#more').addEventListener('click', () => start(false));
$('#q').addEventListener('keydown', e => { if (e.key === 'Enter') start(true); });

/* scroll 到顶：继续扫描后用户还在页底，看不到新进度条 */
function setProg(pct) {
  $('#prog').style.display = pct == null ? 'none' : '';
  if (pct != null) $('#progbar').style.width = Math.max(2, pct * 100) + '%';
}

async function start(fresh) {
  const name = $('#q').value.trim();
  if (!name) { msg('先填谱师名', 'err'); return; }
  if (fresh) {
    SCAN.name = name; SCAN.exact = []; SCAN.fuzzy = []; SCAN.seen = [];
    SCAN.count = 0; SCAN.pages = 1; SCAN.lastPage = 0; SCAN.done = false;
    VIEW.page = 1;
    $('#out').innerHTML = '';
    $('#more').style.display = 'none';
  }
  if (SCAN.name !== name) { await start(true); return; }

  $('#go').disabled = true; $('#more').disabled = true;
  setProg(0);
  msg('扫描中…（每页 30 条搜索结果，命中作品会即时显示）');

  try {
    const need = SCAN.pages - SCAN.lastPage;
    const chunk = Math.max(1, Math.min(fresh ? 10 : 10, need || 10));
    const r = await scanCharter(name, {
      fromPage: SCAN.lastPage + 1,
      maxPages: chunk,
      seen: SCAN.seen,
      onProgress: p => {
        setProg(p.page / Math.max(1, p.pages));
        msg('扫描中… 第 <b>' + p.page + '/' + p.pages + '</b> 页（共 ' + p.count + ' 条搜索结果）'
          + ' · 已筛出 <b>' + p.exact + '</b> 张作品');
      },
    });

    SCAN.count = r.count; SCAN.pages = r.pages; SCAN.lastPage = r.lastPage;
    SCAN.seen = r.seen;
    /* 累积合并（scanCharter 只回本次新增的，去重后的全量在页面里拼） */
    const have = new Set(SCAN.exact.map(c => c.id).concat(SCAN.fuzzy.map(c => c.id)));
    for (const c of r.exact) if (!have.has(c.id)) { have.add(c.id); SCAN.exact.push(c); }
    for (const c of r.fuzzy) if (!have.has(c.id)) { have.add(c.id); SCAN.fuzzy.push(c); }
    SCAN.exact.sort((a, b) => (+b.difficulty || 0) - (+a.difficulty || 0));
    SCAN.fuzzy.sort((a, b) => (+b.difficulty || 0) - (+a.difficulty || 0));
    SCAN.done = SCAN.lastPage >= SCAN.pages;

    setProg(null);
    if (!SCAN.exact.length && !SCAN.fuzzy.length) {
      if (SCAN.done) {
        /* 反馈：「搜 平方秒和立方吨 出来 57 条但没一条 charter 对得上 → 气急败坏」。
           光说"试试短一点"不够 —— 直接**把候选词算出来给他点**。 */
        const cands = shortCands(name);
        msg('Phira 上搜「' + esc(name) + '」共 <b>' + SCAN.count + '</b> 条结果，'
          + '但没有一条的 <b>charter 字段含这个词</b>。<br>'
          + 'Phira 的谱师字段是<b>自由文本</b>（可以写成团队名、带后缀、甚至写别人的名字），'
          + '所以搜不到通常不是"这个人不存在"，而是<b>写法不一样</b>。'
          + (cands.length ? '<br><b>试试这些更短的关键词：</b>'
              + cands.map(c => '<button class="btn sm cand" data-n="' + esc(c) + '" style="margin:4px 4px 0 0">'
                  + esc(c) + '</button>').join('') : '')
          + (cands.length ? '<div style="margin-top:8px" class="dim2">如果某个词搜出来的结果里'
              + '「charter 里包含」那一栏有他，点进去就能看到确切写法。</div>' : ''), 'warn');
        $('#msg').querySelectorAll('button.cand').forEach(b =>
          b.addEventListener('click', () => { $('#q').value = b.getAttribute('data-n'); start(true); }));
      } else {
        msg('这一批没筛到，但还有 ' + (SCAN.pages - SCAN.lastPage) + ' 页没扫 —— 点「继续扫描」。', 'warn');
      }
      $('#go').disabled = false;
      $('#more').style.display = SCAN.done ? 'none' : '';
      $('#more').disabled = false;
      return;
    }

    /* 补 P.H.M. 定数（一次批量，失败不影响主体） */
    msg('读取 P.H.M. 定数缓存…');
    await loadChartCache(SCAN.exact.map(c => c.id));
    msg('');
    render();
  } catch (e) {
    setProg(null);
    msg('扫描失败：' + esc(e.message || e) + '（Phira API 可能临时不可用）', 'err');
  }
  $('#go').disabled = false;
  $('#more').disabled = false;
  $('#more').style.display = SCAN.done ? 'none' : '';
}

function render() {
  const name = SCAN.name;
  const all = SCAN.exact;
  const dist = {};
  for (const c of all) { const t = lvTag(c.level); dist[t] = (dist[t] || 0) + 1; }
  const wd = all.filter(c => +c.difficulty > 0 && +c.difficulty <= 20);
  const avg = wd.length ? wd.reduce((a, c) => a + (+c.difficulty), 0) / wd.length : null;
  const pmRows = all.map(c => cachedRow(c.id)).filter(x => x && x.ref_const != null);
  const pmAvg = pmRows.length ? pmRows.reduce((a, x) => a + (+x.ref_const), 0) / pmRows.length : null;
  const order = ['EZ', 'HD', 'IN', 'AT', 'SP', '?'];

  let h = '<div class="card">';
  h += '<div class="chhead"><div><div class="nm">' + esc(name) + '</div>'
    + '<div class="mt">charter 精确同名 · 已扫 <b>' + SCAN.lastPage + '</b>/' + SCAN.pages
    + ' 页搜索结果（共 ' + SCAN.count + ' 条）'
    + (SCAN.done ? ' · <span style="color:var(--green)">扫描完整</span>'
                 : ' · <span style="color:var(--amber)">尚未扫完</span>') + '</div></div></div>';

  h += '<div class="sumgrid">'
    + sum('作品数', all.length)
    + sum('标称均值', avg == null ? '—' : f2(avg), wd.length + ' 张有标称')
    + sum('P.H.M. 均值', pmAvg == null ? '—' : f2(pmAvg), pmRows.length + ' 张已算')
    + sum('最高标称', wd.length ? f2(Math.max(...wd.map(c => +c.difficulty))) : '—')
    + '</div>';

  const tot = all.length || 1;
  h += '<div class="dist">' + order.filter(t => dist[t]).map(t =>
    '<i style="width:' + (dist[t] / tot * 100) + '%;background:' + tierColor(t) + '" title="' + t + '">'
    + ((dist[t] / tot) > 0.08 ? t + ' ' + dist[t] : '') + '</i>').join('') + '</div>';
  h += '<div class="distlg">' + order.filter(t => dist[t]).map(t =>
    '<span><i style="background:' + tierColor(t) + '"></i>' + t + ' × ' + dist[t] + '</span>').join('') + '</div>';

  if (!SCAN.done) {
    h += '<div class="note">还有 <b>' + (SCAN.pages - SCAN.lastPage) + '</b> 页搜索结果没扫。'
      + '上面这些数字只统计已扫到的部分 —— 点上方「继续扫描 ›」补齐。</div>';
  }
  h += '</div>';

  /* 作品表 —— 客户端分页（扫描结果已经在内存里，没必要再请求） */
  let list = all.slice();
  if (VIEW.filter !== 'all') list = list.filter(c => lvTag(c.level) === VIEW.filter);
  if (VIEW.sort === 'diff') list.sort((a, b) => (+b.difficulty || 0) - (+a.difficulty || 0));
  else if (VIEW.sort === 'pm') list.sort((a, b) => {
    const pa = cachedRow(a.id), pb = cachedRow(b.id);
    return ((pb && pb.ref_const) || -1) - ((pa && pa.ref_const) || -1);
  });
  else if (VIEW.sort === 'name') list.sort((a, b) => String(a.name).localeCompare(String(b.name), 'zh'));
  else list.sort((a, b) => order.indexOf(lvTag(a.level)) - order.indexOf(lvTag(b.level))
    || (+b.difficulty || 0) - (+a.difficulty || 0));

  const pages = Math.max(1, Math.ceil(list.length / VIEW.pageSize));
  if (VIEW.page > pages) VIEW.page = pages;
  const slice = list.slice((VIEW.page - 1) * VIEW.pageSize, VIEW.page * VIEW.pageSize);

  h += '<div class="card"><div class="toolbar">'
    + '<h3 style="margin:0;flex:1">作品列表（' + list.length + ' 张）</h3>'
    + '<select class="inp" id="sort">'
    + [['diff', '标称定数 ↓'], ['pm', 'P.H.M. 定数 ↓'], ['name', '曲名 A→Z'], ['level', '档位']]
        .map(([k, l]) => '<option value="' + k + '"' + (k === VIEW.sort ? ' selected' : '') + '>' + l + '</option>').join('')
    + '</select>'
    + '<select class="inp" id="filter">'
    + [['all', '全部档位']].concat(order.filter(t => dist[t]).map(t => [t, t]))
        .map(([k, l]) => '<option value="' + k + '"' + (k === VIEW.filter ? ' selected' : '') + '>' + l + '</option>').join('')
    + '</select></div>';

  if (!slice.length) h += '<div class="empty">这个筛选下没有作品</div>';
  else {
    h += '<table class="tbl"><thead><tr><th>曲名</th><th>档</th><th class="r">标称</th>'
      + '<th class="r">P.H.M. 定数</th><th class="r">官谱标度</th><th class="r">物量</th></tr></thead><tbody>';
    for (const c of slice) {
      const t = lvTag(c.level);
      const row = cachedRow(c.id);
      const pm = row && row.ref_const != null ? +row.ref_const : null;
      const pmo = row && row.ref_official != null ? +row.ref_official : null;
      const d = +c.difficulty;
      const hadD = d > 0 && d <= 20;
      /* 标称与 P.H.M. 差得多就标出来 —— 这是这个工具最有信息量的地方之一 */
      const gap = (pm != null && hadD) ? pm - d : null;
      h += '<tr><td class="nm" title="' + esc(c.name) + '">' + esc(String(c.name).slice(0, 40)) + '</td>'
        + '<td>' + tierBadge(c.level) + '</td>'
        + '<td class="r">' + (hadD ? f2(d) : '—') + '</td>'
        + '<td class="r ' + (pm == null ? 'nopm' : 'pm') + '">' + (pm == null ? '未算' : f2(pm))
        + (gap != null && Math.abs(gap) >= 0.8
            ? ' <span class="dgap" style="color:' + (gap > 0 ? 'var(--green)' : 'var(--red)') + '">'
              + (gap > 0 ? '+' : '') + f1(gap) + '</span>' : '') + '</td>'
        + '<td class="r dim">' + (pmo == null ? '—' : f2(pmo)) + '</td>'
        + '<td class="r dim">' + (c.notes == null ? '—' : c.notes) + '</td></tr>';
    }
    h += '</tbody></table>';
  }
  h += '<div id="pg1">' + pagerHTML({ page: VIEW.page, pages, total: list.length, pageSize: VIEW.pageSize, sizes: SIZES }) + '</div>';
  const uncalc = list.filter(c => { const r = cachedRow(c.id); return !(r && r.ref_const != null); }).length;
  if (uncalc) h += '<div class="note info">还有 <b>' + uncalc + '</b> 张在这个筛选下没算过 P.H.M. 定数。'
    + '去<a href="/app">算定数</a>页拖入谱面包，或点「算」让服务端下载计算。</div>';
  h += '</div>';

  /* 模糊命中：单独一栏，最多列 40 条（这些不是他的作品，没必要全列） */
  if (SCAN.fuzzy.length) {
    h += '<div class="card"><h3 style="margin-top:0">charter 里<b>包含</b>「' + esc(name) + '」但不是完全同名的 '
      + SCAN.fuzzy.length + ' 张</h3>'
      + '<div class="sub">可能是团队名、带后缀的写法，或别人的谱面说明里提到了这个词。</div>'
      + '<table class="tbl"><thead><tr><th>曲名</th><th>谱师</th><th>档</th><th class="r">标称</th></tr></thead><tbody>'
      + SCAN.fuzzy.slice(0, 40).map(c =>
        '<tr><td class="nm">' + esc(String(c.name).slice(0, 34)) + '</td>'
        + '<td class="dim">' + esc(c.charter) + '</td>'
        + '<td>' + tierBadge(c.level) + '</td>'
        + '<td class="r">' + (+c.difficulty > 0 && +c.difficulty <= 20 ? f2(c.difficulty) : '—') + '</td></tr>').join('')
      + '</tbody></table>'
      + (SCAN.fuzzy.length > 40 ? '<div class="dim2" style="font-size:12px;margin-top:6px">… 共 ' + SCAN.fuzzy.length + ' 条</div>' : '')
      + '</div>';
  }

  $('#out').innerHTML = h;
  $('#sort').addEventListener('change', e => { VIEW.sort = e.target.value; VIEW.page = 1; render(); });
  $('#filter').addEventListener('change', e => { VIEW.filter = e.target.value; VIEW.page = 1; render(); });
  wirePager($('#pg1'), p => { VIEW.page = p; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); });
}

/** 从搜不到的名字里生成候选短词。
 *  中文名按 2~4 字切；英文名按空格/大小写边界切。
 *  目的不是猜准，而是**给用户一个能点的起点** —— 让他知道"换个写法再试"是正常操作。 */
function shortCands(name) {
  const s0 = String(name || '').trim();
  const out = new Set();
  /* 全角/半角分隔符都切 */
  const parts = s0.split(/[\s·・\-—_（）()、,，.]+/).filter(Boolean);
  for (const p of parts) {
    if (p.length >= 2) out.add(p);
    /* 中文：取前 2 / 3 字 */
    if (/^[\u4e00-\u9fa5]{3,}$/.test(p)) { out.add(p.slice(0, 2)); out.add(p.slice(0, 3)); }
    /* 英文：按大写边界切 CamelCase */
    if (/^[A-Za-z][A-Za-z0-9]{3,}$/.test(p)) {
      const m = p.match(/[A-Z][a-z0-9]+/g);
      if (m && m.length > 1) m.forEach(x => out.add(x));
    }
  }
  out.delete(s0);
  return [...out].filter(x => x.length >= 2).slice(0, 6);
}

function sum(k, v, n) {
  return '<div class="sum"><div class="k">' + esc(k) + '</div><div class="v">' + v + '</div>'
    + (n ? '<div class="n">' + esc(n) + '</div>' : '') + '</div>';
}

if (pre) start(true);
</script>
</body>
</html>
