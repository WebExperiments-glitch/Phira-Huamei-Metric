name: CodeQL

permissions:
  contents: read
  security-events: write
  actions: read

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 3 * * 1'   # 每周一 11:17 Asia/Shanghai
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # ⚠ 只跑 JS/TS。
        #
        # 曾经这里还有 'python'，但 `.github/codeql/codeql-config.yml` 把
        # tools/、phm-web/tools/、phm/、_research/、llm-hub/ 全部 paths-ignore 了
        # —— 而仓库里的 Python 只有这些目录。于是 Python 那条腿**一个文件都扫不到**，
        # CodeQL 以 `CodeQL could not process any code written in Python`（exit 32）失败。
        #
        # 从 2026-10-26 起 main 上就一直是红的（不是某次改动的锅），
        # 因为它是必需检查，等于**每个 PR 都被一条永远不可能变绿的腿卡住**。
        # 想让 Python 重新被扫，先把它从 paths-ignore 里放出来，再加回这一项。
        language: ['javascript-typescript']
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # 扫描范围见 .github/codeql/codeql-config.yml（排除开发期脚本）
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@v4
