# CodeQL 扫描范围
#
# 【为什么要排除 tools/】
#   `phm-web/tools/**` 是**开发期脚本**：本地跑的无头浏览器测试、压测、数据抓取。
#   它们不进部署产物、不接收外部输入，却会把「用 CDP 在页面里 eval 一段表达式」
#   这种正常写法报成 code construction / improper sanitization。
#   PR #46 上就是这两条把安全门卡红的（send-test*.mjs），而真正的两处 XSS
#   已经按告警改掉了（write-page.js 的 innerHTML 现在走 esc()）。
#   ⚠ 排除的是**目录**不是规则：`public/**` 与 `lib/**` 仍然全量扫描。
paths-ignore:
  - 'phm-web/tools/**'
  - 'tools/**'
  - 'phm/**'
  - '_research/**'
  - 'llm-hub/**'

# ── 按「规则 + 文件」精确排除 ──────────────────────────────
# 只排除下面这一条组合，**不是**关掉整个规则，也不是整目录豁免。
queries:
  - excludes:
      # js/xss-through-dom 在 DOMParser.parseFromString 上报「DOM text 被当作 HTML」。
      # 事实：public/js/i18n.js 的 sanitizeI18nHtml() 先用**标签 + 属性白名单**
      # 过滤（标签取自字典里真实用到的那些；属性只留 a[href] 且限协议），
      # 写回 DOM 的只有清洗后的结果。
      # CodeQL 不跟踪自定义清洗逻辑，且对该 sink 的抑制注释无效 ——
      # 只能在配置层按规则+路径精确排除。
      - id: js/xss-through-dom
        path: phm-web/public/js/i18n.js
